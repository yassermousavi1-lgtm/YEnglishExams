<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card">

            <header class="exam-header">
                <div class="exam-title-section">
                    <div class="exam-icon">📝</div>
                    <div>
                        <h1 id="examTitle">Loading...</h1>
                        <p id="welcomeText">Authenticating...</p>
                    </div>
                </div>
                <div id="timer" class="timer">00:00</div>
            </header>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="questionProgress">Question 1 of 1</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <section id="questionContainer" class="question-container"></section>

            <div class="navigation">
                <button id="previousButton" class="secondary-button" type="button">← Previous</button>
                <button id="nextButton" class="primary-button" type="button">Next →</button>
            </div>

            <div id="status" class="status">Authenticating with Telegram...</div>

        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const examTitleElement = document.getElementById('examTitle');
        const welcomeTextElement = document.getElementById('welcomeText');
        const timerElement = document.getElementById('timer');
        const questionProgressElement = document.getElementById('questionProgress');
        const progressFillElement = document.getElementById('progressFill');
        const questionContainer = document.getElementById('questionContainer');
        const previousButton = document.getElementById('previousButton');
        const nextButton = document.getElementById('nextButton');
        const statusElement = document.getElementById('status');

        // ============================================================
        // STATE
        // ============================================================

        let USER_DATA = null;
        let exam = null;
        let questions = [];
        let currentQuestionIndex = 0;
        let studentAnswers = {};
        let remainingSeconds = 0;
        let timerInterval = null;
        let startedAt = null;
        let isSubmitting = false;
        let examId = null;
        let allGroups = [];

        // ============================================================
        // TELEGRAM USER
        // ============================================================

        const telegramUser = telegram?.initDataUnsafe?.user;

        if (telegramUser) {
            welcomeTextElement.textContent = `Welcome ${telegramUser.first_name || 'Student'}`;
        } else {
            welcomeTextElement.textContent = 'Telegram user not available.';
        }

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    }
                });
                const data = await response.json();
                if (data.status !== 'success') {
                    showError('API Error: ' + (data.message || 'Unknown error'));
                }
                return data;
            } catch (error) {
                showError('Network Error: ' + error.message);
                throw error;
            }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        // ---------- Dashboard ----------
        function renderDashboard(userData) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">👨‍🏫</div>
                    <h1 style="color: #f9fafb;">Teacher Panel</h1>
                    <p style="color: #9ca3af;">Welcome, ${userData.telegram_user.first_name}!</p>
                    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button class="primary-button" style="padding: 16px;" onclick="loadStudents()">👥 Students</button>
                        <button class="primary-button" style="padding: 16px;" onclick="loadExams()">📝 Exams</button>
                        <button class="primary-button" style="padding: 16px;" onclick="loadResults()">📊 Results</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showAddStudent()">➕ Add Student</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showCreateExam()">📝 Create Exam</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showSendExam()">📤 Send Exam</button>
                    </div>
                    <p style="color: #6b7280; margin-top: 30px; font-size: 14px;">More features coming soon...</p>
                </div>
            `;
        }

        // ---------- Students List ----------
        async function loadStudents() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading students...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/students');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load students.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">👥 Students (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.students.length === 0) {
                    html += `<p style="color: #9ca3af;">No students registered yet.</p>`;
                } else {
                    data.students.forEach(s => {
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <strong style="color: #f9fafb;">${s.first_name} ${s.last_name || ''}</strong>
                                <span style="color: #9ca3af; font-size: 14px; display: block;">Telegram ID: ${s.telegram_user_id} | Group: ${s.group_name}</span>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading students.');
            }
        }

        // ---------- Exams List ----------
        async function loadExams() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading exams...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/exams');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load exams.');
                    return;
                }

                const grouped = {};
                data.exams.forEach(e => {
                    const cat = e.category || 'Uncategorized';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(e);
                });

                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📝 Exams (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;

                if (data.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    Object.keys(grouped).forEach(cat => {
                        html += `
                            <div style="margin-bottom: 16px;">
                                <h3 style="color: #60a5fa; margin-bottom: 8px;">📂 ${cat}</h3>
                        `;
                        grouped[cat].forEach(e => {
                            html += `
                                <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${e.title}</strong>
                                        <span style="color: #9ca3af; font-size: 14px; display: block;">ID: ${e.id} | Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                    </div>
                                    <div>
                                        <button style="background: none; border: none; color: #fbbf24; cursor: pointer; font-size: 16px; padding: 4px 8px;" onclick="showEditExam(${e.id})" title="Edit Exam">✏️</button>
                                        <button style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 4px 8px;" onclick="deleteExam(${e.id})" title="Delete Exam">✕</button>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    });
                }

                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading exams.');
            }
        }

        // ---------- Show Edit Exam Form ----------
        function showEditExam(examId) {
            fetchAPI('/api/teacher/exams').then(data => {
                const exam = data.exams.find(e => e.id === examId);
                if (!exam) {
                    alert('Exam not found.');
                    return;
                }
                document.querySelector('.exam-card').innerHTML = `
                    <div style="padding: 20px;">
                        <h2 style="color: #f9fafb;">✏️ Edit Exam</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="loadExams()">← Back</button>
                        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                            <input id="editExamTitle" type="text" value="${exam.title}" placeholder="Exam Title" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                            <input id="editExamCategory" type="text" value="${exam.category || ''}" placeholder="Category" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                            <input id="editExamTimeLimit" type="number" value="${exam.time_limit}" placeholder="Total Time (minutes)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                            <button class="primary-button" style="padding: 14px;" onclick="updateExam(${examId})">Save Changes</button>
                        </div>
                        <div id="editExamStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                    </div>
                `;
            });
        }

        // ---------- Update Exam ----------
        async function updateExam(examId) {
            const title = document.getElementById('editExamTitle').value.trim();
            const category = document.getElementById('editExamCategory').value.trim();
            const timeLimit = document.getElementById('editExamTimeLimit').value.trim();

            if (!title || !timeLimit) {
                document.getElementById('editExamStatus').textContent = '⚠️ Title and Time are required.';
                return;
            }

            try {
                const response = await fetch('/api/teacher/exams', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        exam_id: examId,
                        title: title,
                        category: category || 'Uncategorized',
                        time_limit: parseInt(timeLimit)
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('editExamStatus').textContent = '✅ Exam updated successfully!';
                    setTimeout(() => loadExams(), 1500);
                } else {
                    document.getElementById('editExamStatus').textContent = '❌ ' + (data.message || 'Failed to update exam.');
                }
            } catch (error) {
                document.getElementById('editExamStatus').textContent = '❌ Error updating exam.';
            }
        }

        // ---------- Delete Exam ----------
        async function deleteExam(examId) {
            if (!confirm(`Are you sure you want to delete exam ID ${examId}? This action cannot be undone.`)) return;

            try {
                const response = await fetch('/api/teacher/exams', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Exam deleted successfully.');
                    loadExams();
                } else {
                    alert('❌ ' + (data.message || 'Failed to delete exam.'));
                }
            } catch (error) {
                alert('❌ Error deleting exam.');
            }
        }

        // ---------- Results List ----------
        async function loadResults() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading results...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/results');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load results.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📊 Results (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.results.length === 0) {
                    html += `<p style="color: #9ca3af;">No results yet.</p>`;
                } else {
                    data.results.forEach(r => {
                        const date = r.completed_at ? new Date(r.completed_at).toLocaleString() : 'N/A';
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${r.student_name}</strong>
                                        <span style="color: #60a5fa; display: block;">${r.exam_title}</span>
                                        <span style="color: #34d399; font-weight: 600;">Score: ${r.score}/${r.total_questions} (${r.percentage}%)</span>
                                        <span style="color: #9ca3af; font-size: 12px; display: block;">📅 ${date}</span>
                                    </div>
                                    <div>
                                        <button style="background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 16px; padding: 4px 8px;" onclick="shareResult(${r.id})" title="Share Result">📤</button>
                                        <button style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 4px 8px;" onclick="deleteResult(${r.id})" title="Delete Result">✕</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading results.');
            }
        }

        // ---------- Share Result ----------
        async function shareResult(resultId) {
            try {
                const data = await fetchAPI(`/api/teacher/result_details/${resultId}`);
                if (data.status !== 'success') {
                    alert('Failed to load result details.');
                    return;
                }

                const r = data.result;
                const percentage = Math.round((r.score / r.total_questions) * 100);

                let message = `📊 *Exam Result*\n\n`;
                message += `👤 Student: ${r.student_name}\n`;
                message += `📝 Exam: ${r.exam_title}\n`;
                message += `📅 Date: ${new Date(r.completed_at).toLocaleString()}\n`;
                message += `✅ Score: ${r.score}/${r.total_questions} (${percentage}%)\n\n`;

                // سوالات اشتباه
                const wrongQuestions = [];
                // در حال حاضر فقط سوالات را نمایش می‌دهیم.
                // برای پاسخ‌های دانشجو نیاز به ذخیره‌سازی جداگانه است.

                if (wrongQuestions.length > 0) {
                    message += `❌ *Wrong Answers:*\n`;
                    wrongQuestions.forEach((q, i) => {
                        message += `${i+1}. ${q.question_text}\n`;
                        message += `   Your answer: ${q.your_answer}\n`;
                        message += `   Correct answer: ${q.correct_answer}\n\n`;
                    });
                } else {
                    message += `🎉 *All answers are correct!*\n`;
                }

                message += `\n#YEnglishExams`;

                const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
                window.open(shareUrl, '_blank');

            } catch (error) {
                alert('Error loading result details.');
            }
        }

        // ---------- Delete Result ----------
        async function deleteResult(resultId) {
            if (!confirm(`Are you sure you want to delete this result?`)) return;

            try {
                const response = await fetch('/api/teacher/results', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({ result_id: resultId })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Result deleted successfully.');
                    loadResults();
                } else {
                    alert('❌ ' + (data.message || 'Failed to delete result.'));
                }
            } catch (error) {
                alert('❌ Error deleting result.');
            }
        }

        // ---------- Add Student Form ----------
        function showAddStudent() {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="color: #f9fafb;">➕ Add Student</h2>
                    <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <input id="studentFirstName" type="text" placeholder="First Name" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentLastName" type="text" placeholder="Last Name (optional)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentTelegramId" type="text" placeholder="Telegram User ID" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentGroupId" type="text" placeholder="Group ID" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <button class="primary-button" style="padding: 14px;" onclick="addStudent()">Add Student</button>
                    </div>
                    <div id="addStudentStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        // ---------- Add Student API ----------
        async function addStudent() {
            const firstName = document.getElementById('studentFirstName').value.trim();
            const lastName = document.getElementById('studentLastName').value.trim();
            const telegramUserId = document.getElementById('studentTelegramId').value.trim();
            const groupId = document.getElementById('studentGroupId').value.trim();

            if (!firstName || !telegramUserId || !groupId) {
                document.getElementById('addStudentStatus').textContent = '⚠️ Please fill in all required fields.';
                return;
            }

            document.getElementById('addStudentStatus').textContent = 'Adding student...';

            try {
                const response = await fetch('/api/teacher/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        telegram_user_id: parseInt(telegramUserId),
                        group_id: parseInt(groupId)
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('addStudentStatus').textContent = '✅ Student added successfully!';
                    setTimeout(() => showAddStudent(), 2000);
                } else {
                    document.getElementById('addStudentStatus').textContent = '❌ ' + (data.message || 'Failed to add student.');
                }
            } catch (error) {
                document.getElementById('addStudentStatus').textContent = '❌ Error adding student.';
            }
        }

        // ---------- Create Exam ----------
        function showCreateExam() {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="color: #f9fafb;">📝 Create Exam</h2>
                    <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <input id="examTitle" type="text" placeholder="Exam Title" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="examCategory" type="text" placeholder="Category (e.g. Book Name, Topic)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="examTimeLimit" type="number" placeholder="Total Time (minutes)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="examQuestionCount" type="number" placeholder="Number of Questions" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <textarea id="examQuestionsJson" rows="12" placeholder='[
  {
    "question_text": "What is the capital of France?",
    "option_a": "Berlin",
    "option_b": "Madrid",
    "option_c": "Paris",
    "option_d": "Rome",
    "correct_answer": "C"
  }
]' style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb; font-family: monospace; resize: vertical; direction: ltr;"></textarea>
                        <button class="primary-button" style="padding: 14px;" onclick="createExamWithJson()">Create Exam</button>
                    </div>
                    <div id="createExamStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        // ---------- Create Exam with JSON API ----------
        async function createExamWithJson() {
            const title = document.getElementById('examTitle').value.trim();
            const category = document.getElementById('examCategory').value.trim();
            const timeLimit = document.getElementById('examTimeLimit').value.trim();
            const questionCount = document.getElementById('examQuestionCount').value.trim();
            const questionsJson = document.getElementById('examQuestionsJson').value.trim();

            if (!title || !timeLimit || !questionCount || !questionsJson) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please fill in all fields.';
                return;
            }

            let questions;
            try {
                questions = JSON.parse(questionsJson);
            } catch (error) {
                document.getElementById('createExamStatus').textContent = '⚠️ Invalid JSON format. Please check your input.';
                return;
            }

            if (!Array.isArray(questions) || questions.length === 0) {
                document.getElementById('createExamStatus').textContent = '⚠️ Questions must be a non-empty array.';
                return;
            }

            if (questions.length !== parseInt(questionCount)) {
                document.getElementById('createExamStatus').textContent = '⚠️ Number of questions does not match the JSON data.';
                return;
            }

            document.getElementById('createExamStatus').textContent = 'Creating exam and saving questions...';

            try {
                const response = await fetch('/api/teacher/exams_with_questions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        title: title,
                        category: category || 'Uncategorized',
                        time_limit: parseInt(timeLimit),
                        questions: questions
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('createExamStatus').textContent = '✅ Exam created successfully! (ID: ' + data.exam_id + ')';
                    setTimeout(() => showCreateExam(), 2000);
                } else {
                    document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed to create exam.');
                }
            } catch (error) {
                document.getElementById('createExamStatus').textContent = '❌ Error creating exam.';
            }
        }

        // ---------- Send Exam (با انتخاب گروه) ----------
        async function showSendExam() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading assignments...</p></div>`;
            try {
                const [examsData, assignmentsData, groupsData] = await Promise.all([
                    fetchAPI('/api/teacher/exams'),
                    fetchAPI('/api/teacher/assignments'),
                    fetchAPI('/api/teacher/groups')
                ]);

                if (examsData.status !== 'success' || assignmentsData.status !== 'success' || groupsData.status !== 'success') {
                    showError('Failed to load data.');
                    return;
                }

                allGroups = groupsData.groups || [];

                const assignedMap = {};
                assignmentsData.assignments.forEach(a => {
                    assignedMap[a.exam_id] = a;
                });

                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📤 Send Exam</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;

                if (examsData.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    examsData.exams.forEach(e => {
                        const assigned = assignedMap[e.id];
                        const isAssigned = !!assigned;
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${e.title}</strong>
                                        <span style="color: #9ca3af; font-size: 14px; display: block;">Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                        ${isAssigned ? `<span style="color: #60a5fa; font-size: 14px;">📌 Assigned to: ${assigned.group_name} (${assigned.telegram_group_id})</span>` : `<span style="color: #fbbf24; font-size: 14px;">⚠️ Not assigned to any group</span>`}
                                    </div>
                                    <div>
                                        ${isAssigned ? 
                                            `<button class="primary-button" style="padding: 4px 12px; margin-right: 4px;" onclick="sendExamByExamId(${e.id})">📤 Send</button>
                                             <button style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 4px 8px;" onclick="unassignExam(${e.id})" title="Unassign">🔓</button>` :
                                            `<button class="primary-button" style="padding: 4px 12px; background: #2563eb;" onclick="showAssignForm(${e.id})">📌 Assign & Send</button>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading data.');
            }
        }

        // ---------- Show Assign Form (انتخاب گروه) ----------
        function showAssignForm(examId) {
            let optionsHtml = '';
            allGroups.forEach(g => {
                optionsHtml += `<option value="${g.id}">${g.name} (${g.telegram_group_id})</option>`;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="color: #f9fafb;">📌 Assign Exam to Group</h2>
                    <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="showSendExam()">← Back</button>
                    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <label style="color: #9ca3af;">Select Group:</label>
                        <select id="assignGroupSelect" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                            ${optionsHtml}
                        </select>
                        <button class="primary-button" style="padding: 14px;" onclick="assignAndSendExamWithGroup(${examId})">Assign & Send</button>
                    </div>
                    <div id="assignStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        // ---------- Assign and Send Exam with Selected Group ----------
        async function assignAndSendExamWithGroup(examId) {
            const groupSelect = document.getElementById('assignGroupSelect');
            const groupId = parseInt(groupSelect.value);

            if (!groupId) {
                document.getElementById('assignStatus').textContent = '⚠️ Please select a group.';
                return;
            }

            document.getElementById('assignStatus').textContent = 'Assigning exam to group...';

            try {
                const assignResponse = await fetch('/api/teacher/assign_exam', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        exam_id: examId,
                        group_id: groupId
                    })
                });
                const assignData = await assignResponse.json();

                if (assignData.status !== 'success') {
                    document.getElementById('assignStatus').textContent = '❌ ' + (assignData.message || 'Failed to assign exam.');
                    return;
                }

                document.getElementById('assignStatus').textContent = '✅ Assigned! Sending exam...';

                const sendResponse = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        exam_id: examId,
                        group_id: groupId
                    })
                });
                const sendData = await sendResponse.json();

                if (sendData.status === 'success') {
                    document.getElementById('assignStatus').textContent = '✅ Exam sent successfully!';
                    setTimeout(() => showSendExam(), 2000);
                } else {
                    document.getElementById('assignStatus').textContent = '❌ ' + (sendData.message || 'Failed to send exam.');
                }
            } catch (error) {
                document.getElementById('assignStatus').textContent = '❌ Error processing request.';
            }
        }

        // ---------- Unassign Exam ----------
        async function unassignExam(examId) {
            if (!confirm(`Are you sure you want to unassign exam ID ${examId}? Students will no longer be able to access it.`)) return;

            try {
                const response = await fetch('/api/teacher/unassign_exam', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Exam unassigned successfully.');
                    showSendExam();
                } else {
                    alert('❌ ' + (data.message || 'Failed to unassign exam.'));
                }
            } catch (error) {
                alert('❌ Error unassigning exam.');
            }
        }

        // ---------- Send Exam by Exam ID (already assigned) ----------
        async function sendExamByExamId(examId) {
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = 'margin-top: 12px; color: #9ca3af; text-align: center;';
            document.querySelector('.exam-card > div').appendChild(statusDiv);
            statusDiv.textContent = 'Sending exam...';

            try {
                const response = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        exam_id: examId,
                        group_id: 1
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    statusDiv.textContent = '✅ Exam sent successfully!';
                } else {
                    statusDiv.textContent = '❌ ' + (data.message || 'Failed to send exam.');
                }
            } catch (error) {
                statusDiv.textContent = '❌ Error sending exam.';
            }
        }

        // ---------- Error ----------
        function showError(message) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">⚠️</div>
                    <h1 style="color: #fca5a5;">Error</h1>
                    <p style="color: #9ca3af;">${message}</p>
                    <button class="secondary-button" style="margin-top: 20px; padding: 12px 24px;" onclick="startApp()">🔄 Try Again</button>
                </div>
            `;
        }

        // ---------- Load Exam ----------
        async function loadExam(examId) {
            try {
                statusElement.textContent = 'Loading exam...';

                const response = await fetch(`/api/exam/${examId}/questions`, {
                    method: 'GET',
                    headers: {
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    }
                });

                if (!response.ok) {
                    let message = `HTTP Error ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.message) message = errorData.message;
                    } catch (e) {}
                    showError('Server Error: ' + message);
                    return;
                }

                const data = await response.json();

                if (data.status !== 'success') {
                    showError('API Error: ' + (data.message || 'Unknown error'));
                    return;
                }

                if (!data.exam) {
                    showError('Exam data is missing in response.');
                    return;
                }

                exam = data.exam;
                questions = data.questions || [];

                if (questions.length === 0) {
                    showError('This exam has no questions.');
                    return;
                }

                startedAt = new Date().toISOString();
                examTitleElement.textContent = exam.title;
                remainingSeconds = Number(exam.time_limit) * 60;
                startTimer();
                currentQuestionIndex = 0;
                renderCurrentQuestion();
                statusElement.textContent = '';

            } catch (error) {
                showError('Unexpected Error: ' + error.message);
            }
        }

        // ---------- Render Current Question ----------
        function renderCurrentQuestion() {
            if (!questions.length) return;

            const question = questions[currentQuestionIndex];
            const questionNumber = currentQuestionIndex + 1;
            const totalQuestions = questions.length;

            questionProgressElement.textContent = `Question ${questionNumber} of ${totalQuestions}`;
            progressFillElement.style.width = `${(questionNumber / totalQuestions) * 100}%`;

            questionContainer.innerHTML = '';

            const numberEl = document.createElement('div');
            numberEl.className = 'question-number';
            numberEl.textContent = `Question ${questionNumber}`;
            questionContainer.appendChild(numberEl);

            const textEl = document.createElement('h2');
            textEl.className = 'question-text';
            textEl.textContent = question.question_text;
            questionContainer.appendChild(textEl);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            const optionKeys = ['A', 'B', 'C', 'D'];
            optionKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-button';
                btn.dataset.option = key;

                const letter = document.createElement('span');
                letter.className = 'option-letter';
                letter.textContent = key;

                const text = document.createElement('span');
                text.className = 'option-text';
                text.textContent = question.options[key];

                btn.appendChild(letter);
                btn.appendChild(text);

                if (studentAnswers[question.id] === key) {
                    btn.classList.add('selected');
                }

                btn.addEventListener('click', () => selectAnswer(question.id, key));
                optionsContainer.appendChild(btn);
            });

            questionContainer.appendChild(optionsContainer);
            updateNavigationButtons();
        }

        // ---------- Select Answer ----------
        function selectAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderCurrentQuestion();
        }

        // ---------- Navigation ----------
        function updateNavigationButtons() {
            previousButton.disabled = currentQuestionIndex === 0 || isSubmitting;

            if (currentQuestionIndex === questions.length - 1) {
                nextButton.textContent = 'Submit Exam';
            } else {
                nextButton.textContent = 'Next →';
            }
            nextButton.disabled = isSubmitting;
        }

        // ---------- Timer ----------
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerElement.textContent = '00:00';
                    isSubmitting = true;
                    updateNavigationButtons();
                    statusElement.textContent = 'Time is up.';
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            timerElement.textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (remainingSeconds <= 60) {
                timerElement.classList.add('timer-warning');
            } else {
                timerElement.classList.remove('timer-warning');
            }
        }

        // ---------- Submit Exam ----------
        async function submitExam() {
            if (isSubmitting) return;

            const confirmed = confirm('Are you sure you want to submit the exam?');
            if (!confirmed) return;

            isSubmitting = true;
            updateNavigationButtons();
            statusElement.textContent = 'Submitting exam...';

            try {
                const payload = {
                    exam_id: Number(examId),
                    answers: studentAnswers,
                    started_at: startedAt
                };

                const response = await fetch('/api/exam/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let message = `Submission failed (HTTP ${response.status})`;
                    try {
                        const errorData = await response.json();
                        if (errorData.message) message = errorData.message;
                    } catch (e) {}
                    throw new Error(message);
                }

                const data = await response.json();
                if (data.status !== 'success') {
                    throw new Error(data.message || 'Submission failed.');
                }

                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                showResult(data.result);

            } catch (error) {
                isSubmitting = false;
                updateNavigationButtons();
                statusElement.textContent = error.message || 'Could not submit the exam.';
            }
        }

        // ---------- Show Result ----------
        function showResult(result) {
            const score = result.score;
            const total = result.total_questions;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

            examTitleElement.textContent = 'Exam Completed';
            questionProgressElement.textContent = 'Result';
            progressFillElement.style.width = '100%';

            questionContainer.innerHTML = '';

            const box = document.createElement('div');
            box.className = 'result-box';

            const title = document.createElement('h2');
            title.textContent = 'Your Result';

            const scoreEl = document.createElement('div');
            scoreEl.className = 'result-score';
            scoreEl.textContent = `${score} / ${total}`;

            const percentEl = document.createElement('div');
            percentEl.className = 'result-percentage';
            percentEl.textContent = `${percentage}%`;

            box.appendChild(title);
            box.appendChild(scoreEl);
            box.appendChild(percentEl);
            questionContainer.appendChild(box);

            previousButton.style.display = 'none';
            nextButton.style.display = 'none';
            timerElement.textContent = 'DONE';
            statusElement.textContent = 'Your exam has been submitted successfully.';
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        previousButton.addEventListener('click', () => {
            if (currentQuestionIndex > 0 && !isSubmitting) {
                currentQuestionIndex--;
                renderCurrentQuestion();
            }
        });

        nextButton.addEventListener('click', async () => {
            if (isSubmitting) return;

            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
                return;
            }

            await submitExam();
        });

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                const userData = await fetchAPI('/api/me');
                if (userData.status !== 'success') {
                    showError(userData.message || 'Authentication failed.');
                    return;
                }
                USER_DATA = userData;

                if (userData.is_teacher) {
                    renderDashboard(userData);
                } else {
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    examId = null;
                    if (startParam && startParam.startsWith('exam_')) {
                        examId = startParam.substring(5);
                    }

                    if (!examId) {
                        showError('Exam ID was not received from Telegram.');
                        return;
                    }

                    await loadExam(examId);
                }
            } catch (error) {
                console.error('App error:', error);
                showError('Unable to start the application.');
            }
        }

        // ============================================================
        // START
        // ============================================================

        startApp();
    </script>

</body>

</html>
