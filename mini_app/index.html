<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card">

            <header class="exam-header">
                <div class="exam-title-section">
                    <div class="exam-icon">📝</div>
                    <div>
                        <h1 id="examTitle">Loading...</h1>
                        <p id="welcomeText">Authenticating...</p>
                    </div>
                </div>
                <div id="timer" class="timer">00:00</div>
            </header>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="questionProgress">Question 1 of 1</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <section id="questionContainer" class="question-container"></section>

            <div class="navigation">
                <button id="previousButton" class="secondary-button" type="button">← Previous</button>
                <button id="nextButton" class="primary-button" type="button">Next →</button>
            </div>

            <div id="status" class="status">Authenticating with Telegram...</div>

        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const examTitleElement = document.getElementById('examTitle');
        const welcomeTextElement = document.getElementById('welcomeText');
        const timerElement = document.getElementById('timer');
        const questionProgressElement = document.getElementById('questionProgress');
        const progressFillElement = document.getElementById('progressFill');
        const questionContainer = document.getElementById('questionContainer');
        const previousButton = document.getElementById('previousButton');
        const nextButton = document.getElementById('nextButton');
        const statusElement = document.getElementById('status');

        // ============================================================
        // STATE
        // ============================================================

        let USER_DATA = null;
        let exam = null;
        let questions = [];
        let currentQuestionIndex = 0;
        let studentAnswers = {};
        let remainingSeconds = 0;
        let timerInterval = null;
        let startedAt = null;
        let isSubmitting = false;
        let examId = null;
        let allGroups = [];

        // ============================================================
        // TELEGRAM USER
        // ============================================================

        const telegramUser = telegram?.initDataUnsafe?.user;

        if (telegramUser) {
            welcomeTextElement.textContent = `Welcome ${telegramUser.first_name || 'Student'}`;
        } else {
            welcomeTextElement.textContent = 'Telegram user not available.';
        }

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    }
                });
                const data = await response.json();
                if (data.status !== 'success') {
                    showError('API Error: ' + (data.message || 'Unknown error'));
                }
                return data;
            } catch (error) {
                showError('Network Error: ' + error.message);
                throw error;
            }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        // ---------- Dashboard (آکادمیک) ----------
        function renderDashboard(userData) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 24px 20px;">
                    
                    <div style="text-align: center; margin-bottom: 32px;">
                        <h1 style="color: #f9fafb; font-size: 22px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">Teacher Dashboard</p>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Create</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="showAddStudent()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Student</span>
                            </button>
                            <button class="academic-menu-item" onclick="showAddGroup()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Group</span>
                            </button>
                            <button class="academic-menu-item" onclick="showCreateExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Create Exam</span>
                            </button>
                            <button class="academic-menu-item" onclick="showSendExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Send Exam</span>
                            </button>
                        </div>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Management</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="loadStudents()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Students</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadExams()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Exams</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadResults()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Results</span>
                            </button>
                        </div>
                    </div>

                    <p style="color: #4b5563; text-align: center; font-size: 12px; margin-top: 24px;">YEnglish Exams v2.0</p>
                </div>
            `;
        }

        // ---------- Academic Page Header ----------
        function academicHeader(title, backAction) {
            return `
                <button class="academic-back-button" onclick="${backAction}">▸ Back</button>
                <h2 class="academic-page-title">${title}</h2>
            `;
        }

        // ---------- Students List ----------
        async function loadStudents() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading students...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/students');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load students.');
                    return;
                }
                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Students (' + data.total + ')', 'renderDashboard(USER_DATA)')}
                        <div style="margin-top: 16px;">
                `;
                if (data.students.length === 0) {
                    html += `<p style="color: #9ca3af;">No students registered yet.</p>`;
                } else {
                    data.students.forEach(s => {
                        html += `
                            <div class="academic-card" style="cursor: pointer;" onclick="showStudentProfile(${s.id})">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${s.first_name} ${s.last_name || ''}</strong>
                                        <span style="color: #9ca3af; font-size: 13px; display: block;">Telegram ID: ${s.telegram_user_id}</span>
                                        <span style="color: #60a5fa; font-size: 13px; display: block;">Group ID: ${s.group_id} | ${s.group_name}</span>
                                    </div>
                                    <div>
                                        <button class="academic-icon-btn danger" onclick="event.stopPropagation(); deleteStudent(${s.id})" title="Delete Student">✕</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading students.');
            }
        }

        // ---------- Show Student Profile ----------
        async function showStudentProfile(studentId) {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading profile...</p></div>`;
            try {
                const data = await fetchAPI(`/api/teacher/student/${studentId}`);
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load student profile.');
                    return;
                }
                const s = data.student;
                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Student Profile', 'loadStudents()')}
                        
                        <div class="academic-card" style="text-align: center; margin-bottom: 20px;">
                            <div style="font-size: 40px; margin-bottom: 8px;">👤</div>
                            <h3 style="color: #f9fafb; margin: 8px 0;">${s.first_name} ${s.last_name || ''}</h3>
                            <p style="color: #9ca3af; font-size: 13px; margin: 4px 0;">Telegram ID: ${s.telegram_user_id}</p>
                            <p style="color: #60a5fa; font-size: 13px; margin: 4px 0;">Group ID: ${s.group_id} | ${s.group_name}</p>
                        </div>
                        
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Archived Results (${data.total})</h3>
                `;

                if (data.results.length === 0) {
                    html += `<p style="color: #9ca3af; text-align: center; padding: 20px;">No archived results yet.</p>`;
                } else {
                    data.results.forEach(r => {
                        html += `
                            <div class="academic-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${r.exam_title}</strong>
                                        <span style="color: #34d399; font-weight: 600; display: block;">Score: ${r.score}/${r.total_questions} (${r.percentage}%)</span>
                                        <span style="color: #9ca3af; font-size: 12px; display: block;">${r.completed_at || 'N/A'}</span>
                                    </div>
                                    <div>
                                        <button class="academic-icon-btn primary" onclick="shareResult(${r.id})" title="Share">📤</button>
                                        <button class="academic-icon-btn warning" onclick="unarchiveResult(${r.id}, ${studentId})" title="Unarchive">↩️</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading student profile.');
            }
        }

        // ---------- Delete Student ----------
        async function deleteStudent(studentId) {
            if (!confirm(`Are you sure you want to delete this student? This action cannot be undone.`)) return;
            try {
                const response = await fetch('/api/teacher/students', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ student_id: studentId })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Student deleted successfully.');
                    loadStudents();
                } else {
                    alert('❌ ' + (data.message || 'Failed to delete student.'));
                }
            } catch (error) {
                alert('❌ Error deleting student.');
            }
        }

        // ---------- Exams List ----------
        async function loadExams() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading exams...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/exams');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load exams.');
                    return;
                }
                const grouped = {};
                data.exams.forEach(e => {
                    const cat = e.category || 'Uncategorized';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(e);
                });

                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Exams (' + data.total + ')', 'renderDashboard(USER_DATA)')}
                `;
                if (data.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    Object.keys(grouped).forEach(cat => {
                        html += `
                            <div style="margin-bottom: 20px;">
                                <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid #374151;">${cat}</h3>
                        `;
                        grouped[cat].forEach(e => {
                            html += `
                                <div class="academic-card">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong style="color: #f9fafb;">${e.title}</strong>
                                            <span style="color: #9ca3af; font-size: 13px; display: block;">ID: ${e.id} | Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                        </div>
                                        <div>
                                            <button class="academic-icon-btn warning" onclick="showEditExam(${e.id})" title="Edit">✏️</button>
                                            <button class="academic-icon-btn danger" onclick="deleteExam(${e.id})" title="Delete">✕</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    });
                }
                html += `</div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading exams.');
            }
        }

        // ---------- Show Edit Exam ----------
        function showEditExam(examId) {
            fetchAPI('/api/teacher/exams').then(data => {
                const exam = data.exams.find(e => e.id === examId);
                if (!exam) { alert('Exam not found.'); return; }
                document.querySelector('.exam-card').innerHTML = `
                    <div style="padding: 20px;">
                        ${academicHeader('Edit Exam', 'loadExams()')}
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <input id="editExamTitle" type="text" value="${exam.title}" placeholder="Exam Title" class="academic-input">
                            <input id="editExamCategory" type="text" value="${exam.category || ''}" placeholder="Category" class="academic-input">
                            <input id="editExamTimeLimit" type="number" value="${exam.time_limit}" placeholder="Total Time (minutes)" class="academic-input">
                            <button class="academic-primary-btn" onclick="updateExam(${examId})">Save Changes</button>
                        </div>
                        <div id="editExamStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                    </div>
                `;
            });
        }

        // ---------- Update Exam ----------
        async function updateExam(examId) {
            const title = document.getElementById('editExamTitle').value.trim();
            const category = document.getElementById('editExamCategory').value.trim();
            const timeLimit = document.getElementById('editExamTimeLimit').value.trim();
            if (!title || !timeLimit) {
                document.getElementById('editExamStatus').textContent = '⚠️ Title and Time are required.';
                return;
            }
            try {
                const response = await fetch('/api/teacher/exams', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, title, category: category || 'Uncategorized', time_limit: parseInt(timeLimit) })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('editExamStatus').textContent = '✅ Exam updated successfully!';
                    setTimeout(() => loadExams(), 1500);
                } else {
                    document.getElementById('editExamStatus').textContent = '❌ ' + (data.message || 'Failed to update exam.');
                }
            } catch (error) {
                document.getElementById('editExamStatus').textContent = '❌ Error updating exam.';
            }
        }

        // ---------- Delete Exam ----------
        async function deleteExam(examId) {
            if (!confirm(`Are you sure you want to delete exam ID ${examId}?`)) return;
            try {
                const response = await fetch('/api/teacher/exams', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Exam deleted successfully.'); loadExams(); }
                else { alert('❌ ' + (data.message || 'Failed to delete exam.')); }
            } catch (error) { alert('❌ Error deleting exam.'); }
        }

        // ---------- Results List ----------
        async function loadResults() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading results...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/results');
                if (data.status !== 'success') { showError(data.message || 'Failed to load results.'); return; }
                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Results (' + data.total + ')', 'renderDashboard(USER_DATA)')}
                `;
                if (data.results.length === 0) {
                    html += `<p style="color: #9ca3af;">No results yet.</p>`;
                } else {
                    data.results.forEach(r => {
                        html += `
                            <div class="academic-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${r.student_name}</strong>
                                        <span style="color: #60a5fa; display: block; font-size: 13px;">${r.exam_title}</span>
                                        <span style="color: #34d399; font-weight: 600; font-size: 14px;">Score: ${r.score}/${r.total_questions} (${r.percentage}%)</span>
                                        <span style="color: #9ca3af; font-size: 12px; display: block;">${r.completed_at || 'N/A'}</span>
                                    </div>
                                    <div>
                                        <button class="academic-icon-btn primary" onclick="shareResult(${r.id})" title="Share">📤</button>
                                        <button class="academic-icon-btn warning" onclick="archiveResult(${r.id})" title="Archive">📦</button>
                                        <button class="academic-icon-btn danger" onclick="deleteResult(${r.id})" title="Delete">✕</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) { showError('Error loading results.'); }
        }

        // ---------- Archive Result ----------
        async function archiveResult(resultId) {
            if (!confirm(`Archive this result? It will move to the student's profile.`)) return;
            try {
                const response = await fetch('/api/teacher/archive_result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ result_id: resultId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Result archived successfully.'); loadResults(); }
                else { alert('❌ ' + (data.message || 'Failed to archive result.')); }
            } catch (error) { alert('❌ Error archiving result.'); }
        }

        // ---------- Unarchive Result ----------
        async function unarchiveResult(resultId, studentId) {
            if (!confirm(`Unarchive this result? It will return to the Results list.`)) return;
            try {
                const response = await fetch('/api/teacher/unarchive_result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ result_id: resultId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Result unarchived successfully.'); showStudentProfile(studentId); }
                else { alert('❌ ' + (data.message || 'Failed to unarchive result.')); }
            } catch (error) { alert('❌ Error unarchiving result.'); }
        }

        // ---------- Share Result ----------
        async function shareResult(resultId) {
            try {
                const data = await fetchAPI(`/api/teacher/result_details/${resultId}`);
                if (data.status !== 'success') { alert('Failed to load result details.'); return; }
                const r = data.result;
                const percentage = Math.round((r.score / r.total_questions) * 100);
                let message = `📊 *Exam Result*\n\n`;
                message += `👤 Student: ${r.student_name}\n`;
                message += `📝 Exam: ${r.exam_title}\n`;
                message += `📅 Date: ${r.completed_at || 'N/A'}\n`;
                message += `✅ Score: ${r.score}/${r.total_questions} (${percentage}%)\n\n`;
                const wrongQuestions = r.wrong_answers || [];
                if (wrongQuestions.length > 0) {
                    message += `❌ *Wrong Answers:*\n`;
                    wrongQuestions.forEach((q, i) => {
                        message += `${i+1}. ${q.question_text}\n`;
                        message += `   Your answer: ${q.selected_answer || 'No answer'}\n`;
                        message += `   Correct answer: ${q.correct_answer}\n\n`;
                    });
                } else { message += `🎉 *All answers are correct!*\n`; }
                message += `\n#YEnglishExams`;
                const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
                window.open(shareUrl, '_blank');
            } catch (error) { alert('Error loading result details.'); }
        }

        // ---------- Delete Result ----------
        async function deleteResult(resultId) {
            if (!confirm(`Are you sure you want to delete this result?`)) return;
            try {
                const response = await fetch('/api/teacher/results', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ result_id: resultId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Result deleted successfully.'); loadResults(); }
                else { alert('❌ ' + (data.message || 'Failed to delete result.')); }
            } catch (error) { alert('❌ Error deleting result.'); }
        }

        // ---------- Add Student Form ----------
        function showAddStudent() {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    ${academicHeader('Add Student', 'renderDashboard(USER_DATA)')}
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <input id="studentFirstName" type="text" placeholder="First Name" class="academic-input">
                        <input id="studentLastName" type="text" placeholder="Last Name (optional)" class="academic-input">
                        <input id="studentTelegramId" type="text" placeholder="Telegram User ID" class="academic-input">
                        <input id="studentGroupId" type="text" placeholder="Group ID" class="academic-input">
                        <button class="academic-primary-btn" onclick="addStudent()">Add Student</button>
                    </div>
                    <div id="addStudentStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        async function addStudent() {
            const firstName = document.getElementById('studentFirstName').value.trim();
            const lastName = document.getElementById('studentLastName').value.trim();
            const telegramUserId = document.getElementById('studentTelegramId').value.trim();
            const groupId = document.getElementById('studentGroupId').value.trim();
            if (!firstName || !telegramUserId || !groupId) {
                document.getElementById('addStudentStatus').textContent = '⚠️ Please fill in all required fields.';
                return;
            }
            document.getElementById('addStudentStatus').textContent = 'Adding student...';
            try {
                const response = await fetch('/api/teacher/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ first_name: firstName, last_name: lastName, telegram_user_id: parseInt(telegramUserId), group_id: parseInt(groupId) })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('addStudentStatus').textContent = '✅ Student added successfully!';
                    setTimeout(() => showAddStudent(), 2000);
                } else { document.getElementById('addStudentStatus').textContent = '❌ ' + (data.message || 'Failed to add student.'); }
            } catch (error) { document.getElementById('addStudentStatus').textContent = '❌ Error adding student.'; }
        }

        // ---------- Add Group Form ----------
        function showAddGroup() {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    ${academicHeader('Add Group', 'renderDashboard(USER_DATA)')}
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <input id="groupName" type="text" placeholder="Group Name" class="academic-input">
                        <input id="groupTelegramId" type="text" placeholder="Telegram Group ID (e.g. -1234567890)" class="academic-input">
                        <button class="academic-primary-btn" onclick="addGroup()">Add Group</button>
                    </div>
                    <div id="addGroupStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        async function addGroup() {
            const name = document.getElementById('groupName').value.trim();
            const telegramGroupId = document.getElementById('groupTelegramId').value.trim();
            if (!name || !telegramGroupId) {
                document.getElementById('addGroupStatus').textContent = '⚠️ Please fill in all fields.';
                return;
            }
            document.getElementById('addGroupStatus').textContent = 'Adding group...';
            try {
                const response = await fetch('/api/teacher/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ name, telegram_group_id: parseInt(telegramGroupId) })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('addGroupStatus').textContent = '✅ Group added successfully! (ID: ' + data.group_id + ')';
                    setTimeout(() => showAddGroup(), 2000);
                } else { document.getElementById('addGroupStatus').textContent = '❌ ' + (data.message || 'Failed to add group.'); }
            } catch (error) { document.getElementById('addGroupStatus').textContent = '❌ Error adding group.'; }
        }

        // ---------- Create Exam ----------
        function showCreateExam() {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    ${academicHeader('Create Exam', 'renderDashboard(USER_DATA)')}
                    <div style="text-align: right; margin-bottom: 12px;">
                        <a href="/template.json" download="template.json" class="academic-link">⬇ Download JSON Template</a>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <input id="examTitle" type="text" placeholder="Exam Title" class="academic-input">
                        <input id="examCategory" type="text" placeholder="Category (e.g. Book Name, Topic)" class="academic-input">
                        <input id="examTimeLimit" type="number" placeholder="Total Time (minutes)" class="academic-input">
                        <input id="examQuestionCount" type="number" placeholder="Number of Questions" class="academic-input">
                        <textarea id="examQuestionsJson" rows="12" placeholder='[{"question_text":"...","option_a":"...","option_b":"...","option_c":"...","option_d":"...","correct_answer":"A"}]' class="academic-input" style="font-family: monospace; direction: ltr; resize: vertical;"></textarea>
                        <button class="academic-primary-btn" onclick="createExamWithJson()">Create Exam</button>
                    </div>
                    <div id="createExamStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        async function createExamWithJson() {
            const title = document.getElementById('examTitle').value.trim();
            const category = document.getElementById('examCategory').value.trim();
            const timeLimit = document.getElementById('examTimeLimit').value.trim();
            const questionCount = document.getElementById('examQuestionCount').value.trim();
            const questionsJson = document.getElementById('examQuestionsJson').value.trim();
            if (!title || !timeLimit || !questionCount || !questionsJson) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please fill in all fields.';
                return;
            }
            let questions;
            try { questions = JSON.parse(questionsJson); }
            catch (error) { document.getElementById('createExamStatus').textContent = '⚠️ Invalid JSON format.'; return; }
            if (!Array.isArray(questions) || questions.length === 0) {
                document.getElementById('createExamStatus').textContent = '⚠️ Questions must be a non-empty array.';
                return;
            }
            if (questions.length !== parseInt(questionCount)) {
                document.getElementById('createExamStatus').textContent = '⚠️ Number of questions does not match.';
                return;
            }
            document.getElementById('createExamStatus').textContent = 'Creating exam...';
            try {
                const response = await fetch('/api/teacher/exams_with_questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ title, category: category || 'Uncategorized', time_limit: parseInt(timeLimit), questions })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('createExamStatus').textContent = '✅ Exam created successfully! (ID: ' + data.exam_id + ')';
                    setTimeout(() => showCreateExam(), 2000);
                } else { document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed to create exam.'); }
            } catch (error) { document.getElementById('createExamStatus').textContent = '❌ Error creating exam.'; }
        }

        // ---------- Send Exam ----------
        async function showSendExam() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading...</p></div>`;
            try {
                const [examsData, assignmentsData, groupsData] = await Promise.all([
                    fetchAPI('/api/teacher/exams'), fetchAPI('/api/teacher/assignments'), fetchAPI('/api/teacher/groups')
                ]);
                if (examsData.status !== 'success' || assignmentsData.status !== 'success' || groupsData.status !== 'success') {
                    showError('Failed to load data.'); return;
                }
                allGroups = groupsData.groups || [];
                const assignedMap = {};
                assignmentsData.assignments.forEach(a => { assignedMap[a.exam_id] = a; });
                let html = `<div style="padding: 20px;">${academicHeader('Send Exam', 'renderDashboard(USER_DATA)')}`;
                if (examsData.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    examsData.exams.forEach(e => {
                        const assigned = assignedMap[e.id];
                        const isAssigned = !!assigned;
                        html += `
                            <div class="academic-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${e.title}</strong>
                                        <span style="color: #9ca3af; font-size: 13px; display: block;">Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                        ${isAssigned ? `<span style="color: #60a5fa; font-size: 13px;">Assigned to: ${assigned.group_name} (ID: ${assigned.group_id})</span>` : `<span style="color: #fbbf24; font-size: 13px;">Not assigned</span>`}
                                    </div>
                                    <div>
                                        ${isAssigned ? 
                                            `<button class="academic-icon-btn primary" onclick="sendExamByExamId(${e.id})" title="Send">📤</button>
                                             <button class="academic-icon-btn danger" onclick="unassignExam(${e.id})" title="Unassign">🔓</button>` :
                                            `<button class="academic-primary-btn small" onclick="showAssignForm(${e.id})">Assign & Send</button>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) { showError('Error loading data.'); }
        }

        function showAssignForm(examId) {
            let groupsHtml = '';
            if (allGroups.length === 0) {
                groupsHtml = `<p style="color: #fbbf24;">No groups available.</p>`;
            } else {
                allGroups.forEach(g => {
                    groupsHtml += `
                        <label class="academic-card" style="display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 8px;">
                            <input type="checkbox" class="assign-group-checkbox" value="${g.id}" style="width: 18px; height: 18px; cursor: pointer;">
                            <div style="flex: 1;">
                                <strong style="color: #f9fafb; font-size: 15px;">${g.name}</strong>
                                <span style="color: #60a5fa; font-size: 12px; display: block;">Group ID: ${g.id}</span>
                                <span style="color: #9ca3af; font-size: 12px; display: block;">Telegram ID: ${g.telegram_group_id}</span>
                            </div>
                        </label>
                    `;
                });
            }
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    ${academicHeader('Assign Exam to Groups', 'showSendExam()')}
                    <p style="color: #9ca3af; margin-bottom: 12px;">Select one or more groups:</p>
                    ${groupsHtml}
                    <button class="academic-primary-btn" style="margin-top: 16px; width: 100%;" onclick="assignAndSendExamWithGroups(${examId})">Assign & Send</button>
                    <div id="assignStatus" style="margin-top: 12px; color: #9ca3af; text-align: center;"></div>
                </div>
            `;
        }

        async function assignAndSendExamWithGroups(examId) {
            const checkboxes = document.querySelectorAll('.assign-group-checkbox:checked');
            const groupIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (groupIds.length === 0) {
                document.getElementById('assignStatus').textContent = '⚠️ Please select at least one group.';
                return;
            }
            document.getElementById('assignStatus').textContent = 'Assigning...';
            try {
                const assignResponse = await fetch('/api/teacher/assign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const assignData = await assignResponse.json();
                if (assignData.status !== 'success') {
                    document.getElementById('assignStatus').textContent = '❌ ' + (assignData.message || 'Failed.');
                    return;
                }
                document.getElementById('assignStatus').textContent = '✅ Assigned! Sending...';
                const sendResponse = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const sendData = await sendResponse.json();
                if (sendData.status === 'success') {
                    document.getElementById('assignStatus').textContent = '✅ ' + (sendData.message || 'Sent!');
                    setTimeout(() => showSendExam(), 2000);
                } else {
                    document.getElementById('assignStatus').textContent = '❌ ' + (sendData.message || 'Failed.');
                }
            } catch (error) { document.getElementById('assignStatus').textContent = '❌ Error.'; }
        }

        async function unassignExam(examId) {
            if (!confirm(`Unassign exam ID ${examId}? Results are preserved.`)) return;
            try {
                const response = await fetch('/api/teacher/unassign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Unassigned.'); showSendExam(); }
                else { alert('❌ ' + (data.message || 'Failed.')); }
            } catch (error) { alert('❌ Error.'); }
        }

        async function sendExamByExamId(examId) {
            let assignedGroupIds = [];
            try {
                const assignData = await fetchAPI('/api/teacher/assignments');
                assignedGroupIds = assignData.assignments.filter(a => a.exam_id === examId).map(a => a.group_id);
            } catch (e) { alert('❌ Could not find groups.'); return; }
            if (assignedGroupIds.length === 0) { alert('❌ Not assigned.'); return; }
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = 'margin-top: 12px; color: #9ca3af; text-align: center;';
            document.querySelector('.exam-card > div').appendChild(statusDiv);
            statusDiv.textContent = 'Sending...';
            try {
                const response = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: assignedGroupIds })
                });
                const data = await response.json();
                statusDiv.textContent = data.status === 'success' ? '✅ ' + (data.message || 'Sent!') : '❌ ' + (data.message || 'Failed.');
            } catch (error) { statusDiv.textContent = '❌ Error.'; }
        }

        function showError(message) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <h1 style="color: #fca5a5; font-size: 18px;">Error</h1>
                    <p style="color: #9ca3af; font-size: 14px;">${message}</p>
                    <button class="academic-primary-btn" style="margin-top: 20px;" onclick="startApp()">Try Again</button>
                </div>
            `;
        }

        // ---------- Load Exam (Student) ----------
        async function loadExam(examId) {
            try {
                statusElement.textContent = 'Loading exam...';
                const response = await fetch(`/api/exam/${examId}/questions`, {
                    method: 'GET',
                    headers: { 'X-Telegram-Init-Data': telegram?.initData || '' }
                });
                if (!response.ok) {
                    let message = `HTTP Error ${response.status}`;
                    try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                    showError('Server Error: ' + message); return;
                }
                const data = await response.json();
                if (data.status !== 'success') { showError('API Error: ' + (data.message || 'Unknown')); return; }
                if (!data.exam) { showError('Exam data missing.'); return; }
                exam = data.exam;
                questions = data.questions || [];
                if (questions.length === 0) { showError('No questions.'); return; }
                startedAt = new Date().toISOString();
                examTitleElement.textContent = exam.title;
                remainingSeconds = Number(exam.time_limit) * 60;
                startTimer();
                currentQuestionIndex = 0;
                renderCurrentQuestion();
                statusElement.textContent = '';
            } catch (error) { showError('Unexpected Error: ' + error.message); }
        }

        function renderCurrentQuestion() {
            if (!questions.length) return;
            const question = questions[currentQuestionIndex];
            const questionNumber = currentQuestionIndex + 1;
            const totalQuestions = questions.length;
            questionProgressElement.textContent = `Question ${questionNumber} of ${totalQuestions}`;
            progressFillElement.style.width = `${(questionNumber / totalQuestions) * 100}%`;
            questionContainer.innerHTML = '';
            const numberEl = document.createElement('div');
            numberEl.className = 'question-number';
            numberEl.textContent = `Question ${questionNumber}`;
            questionContainer.appendChild(numberEl);
            const textEl = document.createElement('h2');
            textEl.className = 'question-text';
            textEl.textContent = question.question_text;
            questionContainer.appendChild(textEl);
            if (question.audio_url) {
                const audioEl = document.createElement('audio');
                audioEl.controls = true;
                audioEl.style.cssText = 'width: 100%; margin: 12px 0;';
                const source = document.createElement('source');
                source.src = question.audio_url;
                source.type = 'audio/mpeg';
                audioEl.appendChild(source);
                questionContainer.appendChild(audioEl);
            }
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            const optionKeys = ['A', 'B', 'C', 'D'].filter(key => question.options[key] && question.options[key].trim() !== '');
            optionKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-button';
                btn.dataset.option = key;
                const letter = document.createElement('span');
                letter.className = 'option-letter';
                letter.textContent = key;
                const text = document.createElement('span');
                text.className = 'option-text';
                text.textContent = question.options[key];
                btn.appendChild(letter);
                btn.appendChild(text);
                if (studentAnswers[question.id] === key) btn.classList.add('selected');
                btn.addEventListener('click', () => selectAnswer(question.id, key));
                optionsContainer.appendChild(btn);
            });
            questionContainer.appendChild(optionsContainer);
            updateNavigationButtons();
        }

        function selectAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderCurrentQuestion();
        }

        function updateNavigationButtons() {
            previousButton.disabled = currentQuestionIndex === 0 || isSubmitting;
            if (currentQuestionIndex === questions.length - 1) {
                nextButton.textContent = 'Submit Exam';
            } else {
                nextButton.textContent = 'Next →';
            }
            nextButton.disabled = isSubmitting;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerElement.textContent = '00:00';
                    isSubmitting = true;
                    updateNavigationButtons();
                    statusElement.textContent = 'Time is up.';
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            if (remainingSeconds <= 60) timerElement.classList.add('timer-warning');
            else timerElement.classList.remove('timer-warning');
        }

        async function submitExam() {
            if (isSubmitting) return;
            const confirmed = confirm('Are you sure you want to submit?');
            if (!confirmed) return;
            isSubmitting = true;
            updateNavigationButtons();
            statusElement.textContent = 'Submitting...';
            try {
                const payload = { exam_id: Number(examId), answers: studentAnswers, started_at: startedAt };
                const response = await fetch('/api/exam/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    let message = `Failed (HTTP ${response.status})`;
                    try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                    throw new Error(message);
                }
                const data = await response.json();
                if (data.status !== 'success') throw new Error(data.message || 'Failed.');
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                showResult(data.result);
            } catch (error) {
                isSubmitting = false;
                updateNavigationButtons();
                statusElement.textContent = error.message || 'Could not submit.';
            }
        }

        function showResult(result) {
            const score = result.score;
            const total = result.total_questions;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            examTitleElement.textContent = 'Exam Completed';
            questionProgressElement.textContent = 'Result';
            progressFillElement.style.width = '100%';
            questionContainer.innerHTML = '';
            const box = document.createElement('div');
            box.className = 'result-box';
            const title = document.createElement('h2');
            title.textContent = 'Your Result';
            const scoreEl = document.createElement('div');
            scoreEl.className = 'result-score';
            scoreEl.textContent = `${score} / ${total}`;
            const percentEl = document.createElement('div');
            percentEl.className = 'result-percentage';
            percentEl.textContent = `${percentage}%`;
            box.appendChild(title);
            box.appendChild(scoreEl);
            box.appendChild(percentEl);
            questionContainer.appendChild(box);
            previousButton.style.display = 'none';
            nextButton.style.display = 'none';
            timerElement.textContent = 'DONE';
            statusElement.textContent = 'Exam submitted successfully.';
        }

        previousButton.addEventListener('click', () => {
            if (currentQuestionIndex > 0 && !isSubmitting) {
                currentQuestionIndex--;
                renderCurrentQuestion();
            }
        });

        nextButton.addEventListener('click', async () => {
            if (isSubmitting) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
                return;
            }
            await submitExam();
        });

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                const userData = await fetchAPI('/api/me');
                if (userData.status !== 'success') { showError(userData.message || 'Auth failed.'); return; }
                USER_DATA = userData;
                if (userData.is_teacher) {
                    renderDashboard(userData);
                } else {
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    examId = null;
                    if (startParam && startParam.startsWith('exam_')) examId = startParam.substring(5);
                    if (!examId) { showError('Exam ID not received.'); return; }
                    await loadExam(examId);
                }
            } catch (error) { showError('Unable to start.'); }
        }

        startApp();
    </script>

</body>

</html>
