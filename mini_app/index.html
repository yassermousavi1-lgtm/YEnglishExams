<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card" id="appRoot">
            <!-- محتوای صفحه توسط JavaScript ساخته می‌شود -->
        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const appRoot = document.getElementById('appRoot');

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            const response = await fetch(endpoint, {
                ...options,
                headers: {
                    ...options.headers,
                    'X-Telegram-Init-Data': telegram?.initData || ''
                }
            });
            return response.json();
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        // ---------- Dashboard ----------
        function renderDashboard(userData) {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">👨‍🏫</div>
                    <h1 style="color: #f9fafb;">Teacher Panel</h1>
                    <p style="color: #9ca3af;">Welcome, ${userData.telegram_user.first_name}!</p>
                    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button class="primary-button" style="padding: 16px;" onclick="loadStudents()">👥 Students</button>
                        <button class="primary-button" style="padding: 16px;" onclick="loadExams()">📝 Exams</button>
                        <button class="primary-button" style="padding: 16px;" onclick="loadResults()">📊 Results</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showAddStudent()">➕ Add Student</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showCreateExam()">📝 Create Exam</button>
                        <button class="primary-button" style="padding: 16px;" onclick="showSendExam()">📤 Send Exam</button>
                    </div>
                    <button class="secondary-button" style="margin-top: 20px; padding: 12px 24px;" onclick="renderDashboard(USER_DATA)">🏠 Back to Dashboard</button>
                    <p style="color: #6b7280; margin-top: 30px; font-size: 14px;">More features coming soon...</p>
                </div>
            `;
        }

        // ---------- Students List ----------
        async function loadStudents() {
            appRoot.innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading students...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/students');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load students.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">👥 Students (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.students.length === 0) {
                    html += `<p style="color: #9ca3af;">No students registered yet.</p>`;
                } else {
                    data.students.forEach(s => {
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <strong style="color: #f9fafb;">${s.first_name} ${s.last_name || ''}</strong>
                                <span style="color: #9ca3af; font-size: 14px; display: block;">Group: ${s.group_name}</span>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                appRoot.innerHTML = html;
            } catch (error) {
                showError('Error loading students.');
            }
        }

        // ---------- Exams List ----------
        async function loadExams() {
            appRoot.innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading exams...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/exams');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load exams.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📝 Exams (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    data.exams.forEach(e => {
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <strong style="color: #f9fafb;">${e.title}</strong>
                                <span style="color: #9ca3af; font-size: 14px; display: block;">Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                appRoot.innerHTML = html;
            } catch (error) {
                showError('Error loading exams.');
            }
        }

        // ---------- Results List ----------
        async function loadResults() {
            appRoot.innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading results...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/results');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load results.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📊 Results (${data.total})</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.results.length === 0) {
                    html += `<p style="color: #9ca3af;">No results yet.</p>`;
                } else {
                    data.results.forEach(r => {
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151;">
                                <strong style="color: #f9fafb;">${r.student_name}</strong>
                                <span style="color: #60a5fa; display: block;">${r.exam_title}</span>
                                <span style="color: #34d399; font-weight: 600;">Score: ${r.score}/${r.total_questions} (${r.percentage}%)</span>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                appRoot.innerHTML = html;
            } catch (error) {
                showError('Error loading results.');
            }
        }

        // ---------- Add Student Form ----------
        function showAddStudent() {
            appRoot.innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="color: #f9fafb;">➕ Add Student</h2>
                    <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <input id="studentFirstName" type="text" placeholder="First Name" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentLastName" type="text" placeholder="Last Name (optional)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentTelegramId" type="text" placeholder="Telegram User ID" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="studentGroupId" type="text" placeholder="Group ID" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <button class="primary-button" style="padding: 14px;" onclick="addStudent()">Add Student</button>
                    </div>
                    <div id="addStudentStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        // ---------- Add Student API ----------
        async function addStudent() {
            const firstName = document.getElementById('studentFirstName').value.trim();
            const lastName = document.getElementById('studentLastName').value.trim();
            const telegramUserId = document.getElementById('studentTelegramId').value.trim();
            const groupId = document.getElementById('studentGroupId').value.trim();

            if (!firstName || !telegramUserId || !groupId) {
                document.getElementById('addStudentStatus').textContent = '⚠️ Please fill in all required fields.';
                return;
            }

            document.getElementById('addStudentStatus').textContent = 'Adding student...';

            try {
                const response = await fetch('/api/teacher/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        telegram_user_id: parseInt(telegramUserId),
                        group_id: parseInt(groupId)
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('addStudentStatus').textContent = '✅ Student added successfully!';
                    setTimeout(() => showAddStudent(), 2000);
                } else {
                    document.getElementById('addStudentStatus').textContent = '❌ ' + (data.message || 'Failed to add student.');
                }
            } catch (error) {
                document.getElementById('addStudentStatus').textContent = '❌ Error adding student.';
            }
        }

        // ---------- Create Exam ----------
        function showCreateExam() {
            appRoot.innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="color: #f9fafb;">📝 Create Exam</h2>
                    <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <input id="examTitle" type="text" placeholder="Exam Title" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="examTimeLimit" type="number" placeholder="Time Limit (minutes)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <input id="examQuestionIds" type="text" placeholder="Question IDs (comma separated, e.g. 1,2,3)" style="padding: 12px; border-radius: 10px; border: 1px solid #374151; background: #111827; color: #f9fafb;">
                        <button class="primary-button" style="padding: 14px;" onclick="createExam()">Create Exam</button>
                    </div>
                    <div id="createExamStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        // ---------- Create Exam API ----------
        async function createExam() {
            const title = document.getElementById('examTitle').value.trim();
            const timeLimit = document.getElementById('examTimeLimit').value.trim();
            const questionIds = document.getElementById('examQuestionIds').value.trim();

            if (!title || !timeLimit || !questionIds) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please fill in all fields.';
                return;
            }

            const ids = questionIds.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));
            if (ids.length === 0) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please enter valid question IDs.';
                return;
            }

            document.getElementById('createExamStatus').textContent = 'Creating exam...';

            try {
                const response = await fetch('/api/teacher/exams', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        title: title,
                        time_limit: parseInt(timeLimit),
                        question_ids: ids
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('createExamStatus').textContent = '✅ Exam created successfully! (ID: ' + data.exam_id + ')';
                    setTimeout(() => showCreateExam(), 2000);
                } else {
                    document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed to create exam.');
                }
            } catch (error) {
                document.getElementById('createExamStatus').textContent = '❌ Error creating exam.';
            }
        }

        // ---------- Send Exam ----------
        async function showSendExam() {
            appRoot.innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading assignments...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/assignments');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load assignments.');
                    return;
                }
                let html = `
                    <div style="padding: 16px;">
                        <h2 style="color: #f9fafb;">📤 Send Exam</h2>
                        <button class="secondary-button" style="margin: 12px 0; padding: 8px 16px;" onclick="renderDashboard(USER_DATA)">← Back</button>
                        <div style="margin-top: 12px;">
                `;
                if (data.assignments.length === 0) {
                    html += `<p style="color: #9ca3af;">No assignments found. Please assign an exam to a group first.</p>`;
                } else {
                    data.assignments.forEach(a => {
                        html += `
                            <div style="background: #111827; padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong style="color: #f9fafb;">${a.exam_title}</strong>
                                    <span style="color: #9ca3af; font-size: 14px; display: block;">Group: ${a.group_name}</span>
                                </div>
                                <button class="primary-button" style="padding: 8px 16px;" onclick="sendExam(${a.assignment_id})">📤 Send</button>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                appRoot.innerHTML = html;
            } catch (error) {
                showError('Error loading assignments.');
            }
        }

        // ---------- Send Exam API ----------
        async function sendExam(assignmentId) {
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = 'margin-top: 12px; color: #9ca3af;';
            document.querySelector('#appRoot > div').appendChild(statusDiv);
            statusDiv.textContent = 'Sending exam...';

            try {
                const response = await fetch('/api/teacher/send_exam', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        assignment_id: assignmentId
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    statusDiv.textContent = '✅ Exam sent successfully!';
                } else {
                    statusDiv.textContent = '❌ ' + (data.message || 'Failed to send exam.');
                }
            } catch (error) {
                statusDiv.textContent = '❌ Error sending exam.';
            }
        }

        // ---------- Error ----------
        function showError(message) {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">⚠️</div>
                    <h1 style="color: #fca5a5;">Error</h1>
                    <p style="color: #9ca3af;">${message}</p>
                    <button class="secondary-button" style="margin-top: 20px; padding: 12px 24px;" onclick="startApp()">🔄 Try Again</button>
                </div>
            `;
        }

        // ---------- Student Exam (placeholder) ----------
        function renderStudentExam() {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">📚</div>
                    <h1 style="color: #f9fafb;">Loading Exam...</h1>
                    <p style="color: #9ca3af;">Please wait while we prepare your exam.</p>
                    <div style="margin-top: 20px; display: flex; justify-content: center;">
                        <div style="width: 40px; height: 40px; border: 4px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    </div>
                    <style>
                        @keyframes spin {
                            to { transform: rotate(360deg); }
                        }
                    </style>
                </div>
            `;
        }

        // ============================================================
        // GLOBAL USER DATA
        // ============================================================

        let USER_DATA = null;

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                const userData = await fetchAPI('/api/me');
                if (userData.status !== 'success') {
                    showError(userData.message || 'Authentication failed.');
                    return;
                }
                USER_DATA = userData;
                if (userData.is_teacher) {
                    renderDashboard(userData);
                } else {
                    renderStudentExam();
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    let examId = null;
                    if (startParam && startParam.startsWith('exam_')) {
                        examId = startParam.substring(5);
                    }
                    if (!examId) {
                        showError('Exam ID was not received from Telegram.');
                        return;
                    }
                    setTimeout(() => {
                        renderStudentExam();
                    }, 500);
                }
            } catch (error) {
                console.error('App error:', error);
                showError('Unable to start the application.');
            }
        }

        // ============================================================
        // START
        // ============================================================

        startApp();
    </script>

</body>

</html>
