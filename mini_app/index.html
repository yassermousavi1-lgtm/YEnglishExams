<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card" id="mainCard">

            <header class="exam-header">
                <div class="exam-title-section">
                    <div class="exam-icon">📝</div>
                    <div>
                        <h1 id="examTitle">Loading...</h1>
                        <p id="welcomeText">Authenticating...</p>
                    </div>
                </div>
                <div id="timer" class="timer">00:00</div>
            </header>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="questionProgress">Question 1 of 1</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <section id="questionContainer" class="question-container"></section>

            <div class="navigation">
                <button id="previousButton" class="secondary-button" type="button">← Previous</button>
                <button id="nextButton" class="primary-button" type="button">Next →</button>
            </div>

            <div id="status" class="status">Authenticating with Telegram...</div>

        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const mainCard = document.getElementById('mainCard');
        const examTitleElement = document.getElementById('examTitle');
        const welcomeTextElement = document.getElementById('welcomeText');
        const timerElement = document.getElementById('timer');
        const questionProgressElement = document.getElementById('questionProgress');
        const progressFillElement = document.getElementById('progressFill');
        const questionContainer = document.getElementById('questionContainer');
        const previousButton = document.getElementById('previousButton');
        const nextButton = document.getElementById('nextButton');
        const statusElement = document.getElementById('status');

        // ============================================================
        // STATE
        // ============================================================

        let USER_DATA = null;
        let exam = null;
        let questions = [];
        let currentQuestionIndex = 0;
        let studentAnswers = {};
        let remainingSeconds = 0;
        let timerInterval = null;
        let startedAt = null;
        let isSubmitting = false;
        let examId = null;
        let allGroups = [];
        let currentStudentId = null;
        let isPreviewMode = false;

        // Schedule state
        let scheduleData = [];
        let allStudents = [];
        let currentTodayDate = new Date();

        // Word Bank state
        let wordBankQuestions = [];       // array from API
        let wordBankAnswers = {};         // { questionId: { sentenceNumber: word } }
        let currentWordBankIndex = 0;

        // ============================================================
        // TELEGRAM USER
        // ============================================================

        const telegramUser = telegram?.initDataUnsafe?.user;

        if (telegramUser) {
            welcomeTextElement.textContent = `Welcome ${telegramUser.first_name || 'Student'}`;
        } else {
            welcomeTextElement.textContent = 'Telegram user not available.';
        }

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    }
                });
                const data = await response.json();
                if (data.status !== 'success') {
                    showError('API Error: ' + (data.message || 'Unknown error'));
                }
                return data;
            } catch (error) {
                showError('Network Error: ' + error.message);
                throw error;
            }
        }

        // ============================================================
        // ACADEMIC HEADER
        // ============================================================

        function academicHeader(title, backAction) {
            return `
                <button class="academic-back-button" onclick="${backAction}">▸ Back</button>
                <h2 class="academic-page-title">${title}</h2>
            `;
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function resetCardOverflow() {
            // Called before rendering any new page inside the exam card.
            // Ensures the card is scrollable normally on non-Word-Bank pages.
            const card = document.querySelector('.exam-card');
            if (card) card.style.overflow = '';
        }
        function renderDashboard(userData) {
            resetCardOverflow();
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 24px 20px;">
                    
                    <div style="text-align: center; margin-bottom: 32px;">
                        <h1 style="color: #f9fafb; font-size: 22px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">Teacher Dashboard</p>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Create</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="showAddStudent()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Student</span>
                            </button>
                            <button class="academic-menu-item" onclick="showAddGroup()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Group</span>
                            </button>
                            <button class="academic-menu-item" onclick="showCreateExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Create Exam</span>
                            </button>
                            <button class="academic-menu-item" onclick="showSendExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Send Exam</span>
                            </button>
                        </div>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Management</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="loadStudents()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Students</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadExams()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Exams</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadResults()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Results</span>
                            </button>
                        </div>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Schedule</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="showMySchedule()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>My Schedule</span>
                            </button>
                        </div>
                    </div>

                    <p style="color: #4b5563; text-align: center; font-size: 12px; margin-top: 24px;">YEnglish Exams v2.0</p>
                </div>
            `;
        }

        // ============================================================
        // MY SCHEDULE
        // ============================================================

        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const DAYS_SHORT = { Monday: 'MON', Tuesday: 'TUE', Wednesday: 'WED', Thursday: 'THU', Friday: 'FRI', Saturday: 'SAT', Sunday: 'SUN' };

        function getDayNameFromDate(date) {
            const jsDay = date.getDay();
            const map = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return map[jsDay];
        }

        function formatDateNice(date) {
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            try {
                return date.toLocaleDateString('en-US', options);
            } catch (e) {
                return date.toDateString();
            }
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        async function showMySchedule() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading schedule...</p></div>`;
            try {
                const [scheduleResponse, studentsResponse] = await Promise.all([
                    fetchAPI('/api/teacher/schedule'),
                    fetchAPI('/api/teacher/students')
                ]);
                if (scheduleResponse.status !== 'success' || studentsResponse.status !== 'success') {
                    showError('Failed to load schedule data.');
                    return;
                }
                scheduleData = scheduleResponse.schedule || [];
                allStudents = studentsResponse.students || [];
                currentTodayDate = new Date();
                renderMySchedule();
            } catch (error) {
                showError('Error loading schedule.');
            }
        }

        function getSessionsForDay(dayName) {
            return scheduleData
                .filter(s => s.day_of_week === dayName)
                .sort((a, b) => timeToMinutes(a.start_time) - timeToMinutes(b.start_time));
        }

        function getDayLabel(date) {
            const today = new Date();
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const shownStart = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diffDays = Math.round((shownStart - todayStart) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Tomorrow';
            if (diffDays === -1) return 'Yesterday';
            return null;
        }

        function renderMySchedule() {
            const todayName = getDayNameFromDate(currentTodayDate);
            const todaySessions = getSessionsForDay(todayName);
            const dayLabel = getDayLabel(currentTodayDate);

            let todayHtml = '';
            if (todaySessions.length === 0) {
                todayHtml = `<p style="color: #6b7280; text-align: center; padding: 16px; font-size: 14px;">No classes scheduled for this day.</p>`;
            } else {
                todaySessions.forEach(s => {
                    todayHtml += `
                        <div class="schedule-session-row" onclick="showStudentSchedule(${s.id})">
                            <span class="schedule-color-dot" style="background: ${s.student_color};"></span>
                            <div class="schedule-session-info">
                                <strong>${s.student_name}</strong>
                                <span>${s.start_time} → ${s.end_time}</span>
                            </div>
                            <span class="schedule-session-arrow">▸</span>
                        </div>
                    `;
                });
            }

            let weekHtml = '';
            DAYS_OF_WEEK.forEach(day => {
                const daySessions = getSessionsForDay(day);
                weekHtml += `
                    <div class="week-day-block">
                        <div class="week-day-label">${DAYS_SHORT[day]}</div>
                        <div class="week-day-sessions">
                `;
                if (daySessions.length === 0) {
                    weekHtml += `<span class="week-day-empty">—</span>`;
                } else {
                    daySessions.forEach(s => {
                        weekHtml += `
                            <div class="week-session-row" onclick="showStudentSchedule(${s.id})">
                                <span class="schedule-color-dot" style="background: ${s.student_color};"></span>
                                <span class="week-session-time">${s.start_time}</span>
                                <span class="week-session-name">${s.student_name}</span>
                            </div>
                        `;
                    });
                }
                weekHtml += `
                        </div>
                    </div>
                `;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <button class="academic-back-button" onclick="renderDashboard(USER_DATA)">▸ Back</button>
                    <h2 class="academic-page-title">📅 My Schedule</h2>

                    <button class="academic-primary-btn" style="width: 100%; margin-bottom: 20px;" onclick="showAddSessionForm()">➕ Add Session</button>

                    <div class="today-card">
                        <div class="today-header">
                            <button class="today-arrow" onclick="shiftToday(-1)">◀</button>
                            <div class="today-title">
                                ${dayLabel ? `<span class="today-label">${dayLabel}</span>` : ''}
                                <span class="today-date">${formatDateNice(currentTodayDate)}</span>
                            </div>
                            <button class="today-arrow" onclick="shiftToday(1)">▶</button>
                        </div>
                        <div class="today-sessions">
                            ${todayHtml}
                        </div>
                    </div>

                    <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Full Week</h3>
                    <div class="week-container">
                        ${weekHtml}
                    </div>
                </div>
            `;
        }

        function shiftToday(offsetDays) {
            const newDate = new Date(currentTodayDate);
            newDate.setDate(newDate.getDate() + offsetDays);
            currentTodayDate = newDate;
            renderMySchedule();
        }

        // ============================================================
        // STUDENT SCHEDULE (all sessions of one student)
        // ============================================================

        function showStudentSchedule(scheduleId) {
            const clickedSession = scheduleData.find(s => s.id === scheduleId);
            if (!clickedSession) {
                alert('Session not found.');
                return;
            }

            const studentId = clickedSession.student_id;
            const studentSessions = scheduleData
                .filter(s => s.student_id === studentId)
                .sort((a, b) => {
                    const dayOrder = DAYS_OF_WEEK.indexOf(a.day_of_week) - DAYS_OF_WEEK.indexOf(b.day_of_week);
                    if (dayOrder !== 0) return dayOrder;
                    return timeToMinutes(a.start_time) - timeToMinutes(b.start_time);
                });

            const student = allStudents.find(s => s.id === studentId);
            const studentName = clickedSession.student_name;
            const studentColor = clickedSession.student_color || '#2563eb';

            let sessionsHtml = '';
            if (studentSessions.length === 0) {
                sessionsHtml = `<p style="color: #9ca3af; text-align: center; padding: 20px;">No sessions yet.</p>`;
            } else {
                studentSessions.forEach(s => {
                    sessionsHtml += `
                        <div class="academic-card" style="border-left: 4px solid ${studentColor}; margin-bottom: 8px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
                                <div style="flex: 1; min-width: 0;">
                                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                        <strong style="color: #60a5fa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">${DAYS_SHORT[s.day_of_week]}</strong>
                                        <span style="color: #f9fafb; font-size: 14px; font-weight: 600;">${s.start_time} → ${s.end_time}</span>
                                    </div>
                                    ${s.notes ? `<span style="color: #9ca3af; font-size: 13px; display: block; margin-top: 6px;">📝 ${s.notes}</span>` : `<span style="color: #4b5563; font-size: 12px; display: block; margin-top: 6px;">(no notes)</span>`}
                                </div>
                                <div style="flex-shrink: 0; display: flex; gap: 4px;">
                                    <button class="academic-icon-btn primary" onclick="showEditSessionForm(${s.id})" title="Edit">✏️</button>
                                    <button class="academic-icon-btn danger" onclick="deleteSessionFromStudent(${s.id}, ${studentId})" title="Delete">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <button class="academic-back-button" style="margin-bottom: 0;" onclick="renderMySchedule()">▸ Back</button>
                        <button class="share-btn" onclick="shareStudentSchedule(${studentId})" title="Share Schedule">📤 Share</button>
                    </div>

                    <h2 class="academic-page-title">📋 Student Schedule</h2>

                    <div class="academic-card" style="border-left: 5px solid ${studentColor}; margin-bottom: 16px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span class="schedule-color-dot" style="background: ${studentColor}; width: 22px; height: 22px;"></span>
                            <div>
                                <strong style="color: #f9fafb; font-size: 18px;">${studentName}</strong>
                                <span style="color: #9ca3af; font-size: 13px; display: block;">Student ID: ${studentId}</span>
                                ${student ? `<span style="color: #60a5fa; font-size: 12px; display: block;">Group: ${student.group_name}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button class="academic-primary-btn" style="flex: 1;" onclick="showAddSessionFormForStudent(${studentId})">➕ Add Session</button>
                        ${student ? `<button class="academic-secondary-btn" style="flex: 1;" onclick="showStudentProfileFromSchedule(${studentId})">👤 Profile</button>` : ''}
                    </div>

                    <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Sessions (${studentSessions.length})</h3>

                    ${sessionsHtml}
                </div>
            `;
        }

        function showStudentProfileFromSchedule(studentId) {
            showStudentProfile(studentId, 'schedule');
        }

        function shareStudentSchedule(studentId) {
            const studentSessions = scheduleData
                .filter(s => s.student_id === studentId)
                .sort((a, b) => {
                    const dayOrder = DAYS_OF_WEEK.indexOf(a.day_of_week) - DAYS_OF_WEEK.indexOf(b.day_of_week);
                    if (dayOrder !== 0) return dayOrder;
                    return timeToMinutes(a.start_time) - timeToMinutes(b.start_time);
                });

            if (studentSessions.length === 0) {
                alert('No sessions to share.');
                return;
            }

            const studentName = studentSessions[0].student_name;

            let message = `📅 Student Schedule\n\n`;
            message += `👤 ${studentName}\n\n`;
            message += `📋 Sessions (${studentSessions.length}):\n\n`;

            studentSessions.forEach(s => {
                message += `• ${DAYS_SHORT[s.day_of_week]} ${s.start_time} → ${s.end_time}\n`;
                if (s.notes) {
                    message += `  📝 ${s.notes}\n`;
                }
            });

            message += `\n#YEnglishExams`;

            const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
            window.open(shareUrl, '_blank');
        }

        // ============================================================
        // ADD / EDIT SESSION FORM
        // ============================================================

        function showAddSessionForm() {
            renderSessionForm(null, null, null);
        }

        function showAddSessionFormForStudent(studentId) {
            renderSessionForm(null, studentId, null);
        }

        function showEditSessionForm(scheduleId) {
            const session = scheduleData.find(s => s.id === scheduleId);
            if (!session) { alert('Session not found.'); return; }
            renderSessionForm(session, null, null);
        }

        function renderSessionForm(session, preferredStudentId, returnToStudentId) {
            const isEdit = session !== null;
            const dayValue = isEdit ? session.day_of_week : 'Monday';
            const studentValue = isEdit
                ? session.student_id
                : (preferredStudentId || allStudents[0]?.id || '');
            const startValue = isEdit ? session.start_time : '16:00';
            const endValue = isEdit ? session.end_time : '17:00';
            const notesValue = isEdit ? (session.notes || '') : '';

            let backAction;
            if (isEdit && returnToStudentId) {
                backAction = `showStudentScheduleByStudent(${returnToStudentId})`;
            } else if (isEdit) {
                backAction = `showStudentSchedule(${session.id})`;
            } else if (preferredStudentId) {
                backAction = `showStudentScheduleByStudent(${preferredStudentId})`;
            } else {
                backAction = 'renderMySchedule()';
            }

            let dayOptions = '';
            DAYS_OF_WEEK.forEach(d => {
                const sel = d === dayValue ? 'selected' : '';
                dayOptions += `<option value="${d}" ${sel}>${d}</option>`;
            });

            let studentOptions = '';
            if (allStudents.length === 0) {
                studentOptions = `<option value="">— No students yet. Please add one first —</option>`;
            } else {
                allStudents.forEach(s => {
                    const sel = s.id === studentValue ? 'selected' : '';
                    const fullName = `${s.first_name || ''} ${s.last_name || ''}`.trim();
                    studentOptions += `<option value="${s.id}" ${sel}>${fullName}</option>`;
                });
            }

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 20px;">
                    <button class="academic-back-button" onclick="${backAction}">▸ Back</button>
                    <h2 class="academic-page-title">${isEdit ? '✏️ Edit Session' : '➕ Add Session'}</h2>

                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="color: #9ca3af; font-size: 13px;">Student</label>
                        <select id="sessionStudent" class="academic-filter-select">
                            ${studentOptions}
                        </select>

                        <label style="color: #9ca3af; font-size: 13px;">Day of Week</label>
                        <select id="sessionDay" class="academic-filter-select">
                            ${dayOptions}
                        </select>

                        <label style="color: #9ca3af; font-size: 13px;">Start Time</label>
                        <input id="sessionStart" type="time" class="academic-input" value="${startValue}">

                        <label style="color: #9ca3af; font-size: 13px;">End Time</label>
                        <input id="sessionEnd" type="time" class="academic-input" value="${endValue}">

                        <label style="color: #9ca3af; font-size: 13px;">Notes (optional)</label>
                        <input id="sessionNotes" type="text" placeholder="Notes" class="academic-input" value="${notesValue}">

                        <button class="academic-primary-btn" style="margin-top: 8px;" onclick="saveSessionForm(${isEdit ? session.id : 'null'})">
                            ${isEdit ? 'Save Changes' : 'Add Session'}
                        </button>

                        ${isEdit ? `<button class="academic-secondary-btn" style="margin-top: 4px;" onclick="deleteSessionFromForm(${session.id}, ${session.student_id})">🗑️ Delete Session</button>` : ''}
                    </div>

                    <div id="sessionFormStatus" style="margin-top: 12px; color: #9ca3af;"></div>
                </div>
            `;
        }

        function showStudentScheduleByStudent(studentId) {
            const anySession = scheduleData.find(s => s.student_id === studentId);
            if (anySession) {
                showStudentSchedule(anySession.id);
            } else {
                const student = allStudents.find(s => s.id === studentId);
                const studentName = student ? `${student.first_name || ''} ${student.last_name || ''}`.trim() : 'Student';
                const studentColor = student?.color || '#2563eb';
                document.querySelector('.exam-card').innerHTML = `
                    <div style="padding: 20px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <button class="academic-back-button" style="margin-bottom: 0;" onclick="renderMySchedule()">▸ Back</button>
                            <button class="share-btn" onclick="shareStudentSchedule(${studentId})" title="Share Schedule">📤 Share</button>
                        </div>
                        <h2 class="academic-page-title">📋 Student Schedule</h2>
                        <div class="academic-card" style="border-left: 5px solid ${studentColor}; margin-bottom: 16px;">
                            <strong style="color: #f9fafb; font-size: 18px;">${studentName}</strong>
                            <span style="color: #9ca3af; font-size: 13px; display: block;">Student ID: ${studentId}</span>
                        </div>
                        <button class="academic-primary-btn" style="width: 100%; margin-bottom: 16px;" onclick="showAddSessionFormForStudent(${studentId})">➕ Add Session</button>
                        <p style="color: #9ca3af; text-align: center; padding: 20px;">No sessions yet.</p>
                    </div>
                `;
            }
        }

        async function saveSessionForm(sessionId) {
            const studentId = document.getElementById('sessionStudent').value;
            const day = document.getElementById('sessionDay').value;
            const startTime = document.getElementById('sessionStart').value;
            const endTime = document.getElementById('sessionEnd').value;
            const notes = document.getElementById('sessionNotes').value.trim();

            if (!studentId) {
                document.getElementById('sessionFormStatus').textContent = '⚠️ Please select a student.';
                return;
            }
            if (!startTime || !endTime) {
                document.getElementById('sessionFormStatus').textContent = '⚠️ Please enter both start and end times.';
                return;
            }
            if (timeToMinutes(startTime) >= timeToMinutes(endTime)) {
                document.getElementById('sessionFormStatus').textContent = '⚠️ End time must be after start time.';
                return;
            }

            document.getElementById('sessionFormStatus').textContent = 'Saving...';

            try {
                const url = sessionId ? `/api/teacher/schedule/${sessionId}` : '/api/teacher/schedule';
                const method = sessionId ? 'PUT' : 'POST';
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        student_id: parseInt(studentId),
                        day_of_week: day,
                        start_time: startTime,
                        end_time: endTime,
                        notes: notes
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    await refreshScheduleData();
                    showStudentScheduleByStudent(parseInt(studentId));
                } else {
                    document.getElementById('sessionFormStatus').textContent = '❌ ' + (data.message || 'Failed to save.');
                }
            } catch (error) {
                document.getElementById('sessionFormStatus').textContent = '❌ Error saving session.';
            }
        }

        async function recordSession(studentId, totalAttendance) {
            if (totalAttendance === 0) {
                const firstSession = prompt('This is the first session. What is the session number?', '1');
                if (firstSession === null) return;
                const sessionNumber = parseInt(firstSession);
                if (isNaN(sessionNumber) || sessionNumber <= 0) {
                    alert('⚠️ Please enter a valid session number.');
                    return;
                }
                await addAttendance(studentId, sessionNumber);
            } else {
                await addAttendance(studentId, null);
            }
        }

        async function addAttendance(studentId, sessionNumber) {
            try {
                const response = await fetch('/api/teacher/attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        student_id: studentId,
                        session_number: sessionNumber
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showStudentProfile(studentId);
                } else if (data.need_first_session) {
                    const firstSession = prompt('This is the first session. What is the session number?', '1');
                    if (firstSession === null) return;
                    const sn = parseInt(firstSession);
                    if (isNaN(sn) || sn <= 0) {
                        alert('⚠️ Please enter a valid session number.');
                        return;
                    }
                    await addAttendance(studentId, sn);
                } else {
                    alert('❌ ' + (data.message || 'Failed to record session.'));
                }
            } catch (error) {
                alert('❌ Error recording session.');
            }
        }

        function renderExamsPage() {
            const searchTerm = examSearchTerm.toLowerCase().trim();

            // Filter by title when searching
            let filtered = examsData;
            if (searchTerm) {
                filtered = examsData.filter(e => (e.title || '').toLowerCase().includes(searchTerm));
            }

            // Group by category
            const grouped = {};
            filtered.forEach(e => {
                const cat = e.category || 'Uncategorized';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(e);
            });

            const categories = Object.keys(grouped).sort();

            // When searching, force all matched categories open
            const forceOpen = searchTerm.length > 0;

            let html = `
                <div style="padding: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <button class="academic-back-button" style="margin-bottom: 0;" onclick="renderDashboard(USER_DATA)">▸ Back</button>
                        <button class="exam-search-icon-btn" onclick="toggleExamSearch()" title="Search exams">
                            ${examSearchVisible ? '✕' : '🔍'}
                        </button>
                    </div>

                    <h2 class="academic-page-title">Exams (${examsData.length})</h2>

                    ${examSearchVisible ? `
                        <input 
                            type="text" 
                            id="examSearchInput"
                            class="academic-input"
                            placeholder="🔍 Search exams by title..."
                            value="${escapeHtml(examSearchTerm)}"
                            oninput="onExamSearchInput(this.value)"
                            autocomplete="off"
                            style="margin-bottom: 16px;"
                        >
                    ` : ''}
                </div>
            `;

            if (examsData.length === 0) {
                html += `<div style="padding: 0 20px 20px 20px;"><p style="color: #9ca3af;">No exams created yet.</p></div>`;
                document.querySelector('.exam-card').innerHTML = html;
                return;
            }

            if (filtered.length === 0) {
                html += `<div style="padding: 0 20px 20px 20px;"><p style="color: #fbbf24; text-align: center;">No exams match your search.</p></div>`;
                document.querySelector('.exam-card').innerHTML = html;
                if (examSearchVisible) {
                    const input = document.getElementById('examSearchInput');
                    if (input) input.focus();
                }
                return;
            }

            // Render categories
            html += `<div style="padding: 0 20px 20px 20px;">`;
            categories.forEach(cat => {
                const catId = 'ecat_' + cat.replace(/[^a-zA-Z0-9]/g, '_');
                const isOpen = forceOpen || (openExamCategories[cat] === true);
                const examCount = grouped[cat].length;

                html += `
                    <div style="margin-bottom: 10px;">
                        <div 
                            onclick="toggleExamCategory('${escapeHtml(cat)}')"
                            class="exam-category-header"
                        >
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="exam-category-arrow ${isOpen ? 'open' : ''}">▸</span>
                                <strong style="color: #60a5fa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">${escapeHtml(cat)}</strong>
                                <span style="color: #6b7280; font-size: 12px;">(${examCount})</span>
                            </div>
                        </div>
                        <div id="${catId}" style="display: ${isOpen ? 'block' : 'none'}; margin-top: 6px; padding-left: 6px;">
                `;

                grouped[cat].forEach(e => {
                    const typeLabel = e.exam_type === 'word_bank' ? '📝 Word Bank' : 'MCQ';
                    html += `
                        <div class="academic-card" style="margin-bottom: 6px;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">

                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            document.querySelector('.exam-card').innerHTML = html;

            // Focus the search input if visible
            if (examSearchVisible) {
                const input = document.getElementById('examSearchInput');
                if (input) {

        async function previewExam(examId) {
            isPreviewMode = true;
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading preview...</p></div>`;
            try {
                const response = await fetch(`/api/teacher/preview_exam/${examId}`, {
                    method: 'GET',
                    headers: { 'X-Telegram-Init-Data': telegram?.initData || '' }
                });
                if (!response.ok) {
                    showError('Failed to load preview.');
                    return;
                }
                const data = await response.json();
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load preview.');
                    return;
                }
                exam = data.exam;
                if (data.exam.exam_type === 'word_bank') {
                    wordBankQuestions = data.word_bank_questions || [];
                    if (wordBankQuestions.length === 0) {
                        showError('This exam has no Word Bank questions.');
                        return;
                    }
                    wordBankAnswers = {};
                    renderWordBankView(true);
                    return;
                }
                questions = data.questions || [];
                if (questions.length === 0) {
                    showError('This exam has no questions.');
                    return;
                }
                currentQuestionIndex = 0;
                studentAnswers = {};
                examId = data.exam.id;
                renderPreview();
            } catch (error) {
                showError('Error loading preview.');
            }
        }

        function renderPreview() {
            const totalQuestions = questions.length;
            const questionNumber = currentQuestionIndex + 1;
            const question = questions[currentQuestionIndex];

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'].filter(key => question.options[key] && question.options[key].trim() !== '');
            optionKeys.forEach(key => {
                const selected = studentAnswers[question.id] === key ? 'selected' : '';
                optionsHtml += `
                    <button class="academic-option-button ${selected}" onclick="selectPreviewAnswer(${question.id}, '${key}')">
                        <span class="academic-option-letter">${key}</span>
                        <span class="academic-option-text">${question.options[key]}</span>
                    </button>
                `;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 0;">
                    <div class="preview-banner">
                        <span>⚠️ Preview Mode - Results will NOT be saved</span>
                        <button class="preview-exit-btn" onclick="exitPreview()">Exit Preview</button>
                    </div>
                    
                    <div style="padding: 24px 20px;">
                        <div style="text-align: center; margin-bottom: 24px;">
                            <h1 style="color: #f9fafb; font-size: 20px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                            <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">${exam.title}</p>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <span style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Question ${questionNumber} of ${totalQuestions}</span>
                            <span class="academic-timer" style="color: #f9fafb; font-size: 14px; font-weight: 600;">${exam.time_limit} min</span>
                        </div>

                        <div class="academic-progress-bar" style="margin-bottom: 24px;">
                            <div class="academic-progress-fill" style="width: ${(questionNumber / totalQuestions) * 100}%;"></div>
                        </div>

                        <h2 class="academic-question-text">${question.question_text}</h2>

                        <div class="academic-options-container">
                            ${optionsHtml}
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button class="academic-secondary-btn" style="flex: 1;" onclick="previewPrevious()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>▸ Previous</button>
                            <button class="academic-primary-btn" style="flex: 1;" onclick="previewNext()">
                                ${currentQuestionIndex === totalQuestions - 1 ? 'Finish Preview' : 'Next ▸'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPreviewAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderPreview();
        }

        function previewPrevious() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderPreview();
            }
        }

        function previewNext() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderPreview();
            } else {
                renderPreviewResult();
            }
        }

        function renderPreviewResult() {
            const total = questions.length;
            const answered = Object.keys(studentAnswers).length;
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 0;">

        async function shareResult(resultId) {
            try {
                const data = await fetchAPI(`/api/teacher/result_details/${resultId}`);
                if (data.status !== 'success') { alert('Failed to load result details.'); return; }
                const r = data.result;
                const percentage = Math.round((r.score / r.total_questions) * 100);
                let message = `📊 *Exam Result*\n\n`;
                message += `👤 Student: ${r.student_name}\n`;
                message += `📝 Exam: ${r.exam_title}\n`;
                message += `📅 Date: ${r.completed_at || 'N/A'}\n`;
                message += `✅ Score: ${r.score}/${r.total_questions} (${percentage}%)\n\n`;
                const wrongQuestions = r.wrong_answers || [];
                if (wrongQuestions.length > 0) {
                    message += `❌ *Wrong Answers:*\n`;
                    wrongQuestions.forEach((q, i) => {
                        message += `${i+1}. ${q.question_text}\n`;
                        message += `   Your answer: ${q.selected_answer || 'No answer'}\n`;
                        message += `   Correct answer: ${q.correct_answer}\n\n`;
                    });
                } else { message += `🎉 *All answers are correct!*\n`; }
                message += `\n#YEnglishExams`;
                const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
                window.open(shareUrl, '_blank');
            } catch (error) { alert('Error loading result details.'); }
        }

        async function createExamWithJson() {
            const title = document.getElementById('examTitle').value.trim();
            const category = document.getElementById('examCategory').value.trim();
            const timeLimit = document.getElementById('examTimeLimit').value.trim();
            const questionsJson = document.getElementById('examQuestionsJson').value.trim();

            if (!title || !timeLimit || !questionsJson) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please fill Title, Time, and JSON.';
                return;
            }

            document.getElementById('createExamStatus').textContent = 'Creating exam...';

            try {
                if (selectedExamType === 'word_bank') {
                    // Word Bank: single object
                    let wbData;
                    try { wbData = JSON.parse(questionsJson); }
                    catch (error) { document.getElementById('createExamStatus').textContent = '⚠️ Invalid JSON format.'; return; }
                    if (Array.isArray(wbData)) {
                        document.getElementById('createExamStatus').textContent = '⚠️ Word Bank must be an object, not an array.';
                        return;
                    }

                    const response = await fetch('/api/teacher/exams_with_questions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                        body: JSON.stringify({
                            title,
                            category: category || 'Uncategorized',
                            time_limit: parseInt(timeLimit),
                            word_bank_question: wbData
                        })
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        document.getElementById('createExamStatus').textContent = '✅ Word Bank exam created! (ID: ' + data.exam_id + ')';
                        setTimeout(() => renderCreateExamForm(), 2000);
                    } else {
                        document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed.');
                    }
                    return;
                }

                // MCQ: array
                let questions;
                try { questions = JSON.parse(questionsJson); }
                catch (error) { document.getElementById('createExamStatus').textContent = '⚠️ Invalid JSON format.'; return; }
                if (!Array.isArray(questions) || questions.length === 0) {
                    document.getElementById('createExamStatus').textContent = '⚠️ Questions must be a non-empty array.';
                    return;
                }

                const response = await fetch('/api/teacher/exams_with_questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({
                        title,
                        category: category || 'Uncategorized',
                        time_limit: parseInt(timeLimit),
                        questions
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('createExamStatus').textContent = '✅ MCQ exam created! (ID: ' + data.exam_id + ')';
                    setTimeout(() => renderCreateExamForm(), 2000);
                } else {
                    document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed.');
                }
            } catch (error) {
                document.getElementById('createExamStatus').textContent = '❌ Error: ' + error.message;
            }
        }

                function renderSendExamList() {
            const oldInput = document.getElementById('examSearchInput');
            const searchTerm = (oldInput?.value || '').toLowerCase();
            const cursorPos = oldInput?.selectionStart || 0;
            const wasFocused = document.activeElement === oldInput;

            const categoryFilter = window.selectedCategory || 'all';

            const assignedMap = {};
            window.allAssignments.forEach(a => { 
                if (!assignedMap[a.exam_id]) assignedMap[a.exam_id] = [];
                assignedMap[a.exam_id].push(a);
            });

            let filteredExams = window.allExams.filter(e => {
                const matchesSearch = e.title.toLowerCase().includes(searchTerm);
                const matchesCategory = categoryFilter === 'all' || (e.category || 'Uncategorized') === categoryFilter;
                return matchesSearch && matchesCategory;
            });

            const grouped = {};
            filteredExams.forEach(e => {
                const cat = e.category || 'Uncategorized';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(e);
            });

            const allCategories = [...new Set(window.allExams.map(e => e.category || 'Uncategorized'))].sort();

            let categoryButtonsHtml = `
                <button 
                    onclick="selectCategory('all')" 
                    class="academic-filter-btn ${categoryFilter === 'all' ? 'active' : ''}"
                >
                    All
                </button>
            `;
            allCategories.forEach(cat => {
                categoryButtonsHtml += `
                    <button 
                        onclick="selectCategory('${cat}')" 
                        class="academic-filter-btn ${categoryFilter === cat ? 'active' : ''}"
                    >
                        ${cat}
                    </button>
                `;
            });

            if (!window.openCategories) {
                window.openCategories = {};
            }

            let matchedStudents = [];
            let studentExams = [];

            if (searchTerm.length > 0) {
                matchedStudents = window.allStudents.filter(s => {
                    const fullName = `${s.first_name} ${s.last_name || ''}`.toLowerCase();
                    return fullName.includes(searchTerm) || String(s.telegram_user_id).includes(searchTerm);
                });

                matchedStudents.forEach(s => {
                    window.allAssignments.forEach(a => {
                        if (a.group_id === s.group_id) {
                            const examInfo = window.allExams.find(e => e.id === a.exam_id);
                            if (examInfo) {
                                const alreadyAdded = studentExams.find(se => se.exam.id === examInfo.id && se.student.id === s.id);
                                if (!alreadyAdded) {
                                    studentExams.push({
                                        exam: examInfo,
                                        student: s,
                                        assignment: a
                                    });
                                }
                            }
                        }
                    });
                });
            }

            // ============================================================
            // Assigned Exams section (grouped by exam)
            // ============================================================
            const assignedExamIds = Object.keys(assignedMap).map(id => parseInt(id));
            const assignedExams = window.allExams.filter(e => assignedExamIds.includes(e.id));

            let assignedHtml = '';
            if (assignedExams.length === 0) {
                assignedHtml = `<p style="color: #6b7280; text-align: center; padding: 12px; font-size: 13px;">No exams are currently assigned.</p>`;

        async function unassignExamFromGroup(examId, groupId) {
            if (!confirm(`Unassign this exam from this group?`)) return;
            try {
                const response = await fetch('/api/teacher/unassign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },

                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Unassigned from group.');
                    showSendExam();
                } else {
                    alert('❌ ' + (data.message || 'Failed.'));
                }
            } catch (error) {
                alert('❌ Error.');

            if (!window.openCategories) window.openCategories = {};
            window.openCategories[catId] = !window.openCategories[catId];
            
            const element = document.getElementById('cat_' + catId);
            const arrow = document.getElementById('arrow_' + catId);
            
            if (window.openCategories[catId]) {
                element.style.display = 'block';
                arrow.style.transform = 'rotate(90deg)';

        function showAssignForm(examId) {

            } else {
                allGroups.forEach(g => {
                    groupsHtml += `
