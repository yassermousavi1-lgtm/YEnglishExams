        async function assignAndSendExamWithGroups(examId) {
            const checkboxes = document.querySelectorAll('.assign-group-checkbox:checked');
            const groupIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (groupIds.length === 0) {
                document.getElementById('assignStatus').textContent = '⚠️ Please select at least one group.';
                return;
            }
            document.getElementById('assignStatus').textContent = 'Assigning...';
            try {
                const assignResponse = await fetch('/api/teacher/assign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const assignData = await assignResponse.json();
                if (assignData.status !== 'success') {
                    document.getElementById('assignStatus').textContent = '❌ ' + (assignData.message || 'Failed.');
                    return;
                }
                document.getElementById('assignStatus').textContent = '✅ Assigned! Sending...';
                const sendResponse = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const sendData = await sendResponse.json();
                if (sendData.status === 'success') {
                    document.getElementById('assignStatus').textContent = '✅ ' + (sendData.message || 'Sent!');
                    setTimeout(() => showSendExam(), 2000);
                } else {
                    document.getElementById('assignStatus').textContent = '❌ ' + (sendData.message || 'Failed.');
                }
            } catch (error) { document.getElementById('assignStatus').textContent = '❌ Error.'; }
        }

        async function unassignExam(examId) {
            if (!confirm(`Unassign exam ID ${examId}? Results are preserved.`)) return;
            try {
                const response = await fetch('/api/teacher/unassign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Unassigned.'); showSendExam(); }
                else { alert('❌ ' + (data.message || 'Failed.')); }
            } catch (error) { alert('❌ Error.'); }
        }

        async function sendExamByExamId(examId) {
            let assignedGroupIds = [];
            try {
                const assignData = await fetchAPI('/api/teacher/assignments');
                assignedGroupIds = assignData.assignments.filter(a => a.exam_id === examId).map(a => a.group_id);
            } catch (e) { alert('❌ Could not find groups.'); return; }
            if (assignedGroupIds.length === 0) { alert('❌ Not assigned.'); return; }
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = 'margin-top: 12px; color: #9ca3af; text-align: center;';
            document.querySelector('.exam-card > div').appendChild(statusDiv);
            statusDiv.textContent = 'Sending...';
            try {
                const response = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: assignedGroupIds })
                });
                const data = await response.json();
                statusDiv.textContent = data.status === 'success' ? '✅ ' + (data.message || 'Sent!') : '❌ ' + (data.message || 'Failed.');
            } catch (error) { statusDiv.textContent = '❌ Error.'; }
        }

        // ============================================================
        // STUDENT EXAM — ROUTER (detects MCQ vs Word Bank)
        // ============================================================

        async function loadStudentExam(examId) {
            try {
                statusElement.textContent = 'Loading exam...';
                const response = await fetch(`/api/exam/${examId}/questions`, {
                    method: 'GET',
                    headers: { 'X-Telegram-Init-Data': telegram?.initData || '' }
                });
                if (!response.ok) {
                    let message = `HTTP Error ${response.status}`;
                    try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                    showError('Server Error: ' + message); return;
                }
                const data = await response.json();
                if (data.status !== 'success') { showError('API Error: ' + (data.message || 'Unknown')); return; }
                if (!data.exam) { showError('Exam data missing.'); return; }

                exam = data.exam;
                examId = data.exam.id;

                startedAt = new Date().toISOString();
                remainingSeconds = Number(exam.time_limit) * 60;

                if (exam.exam_type === 'word_bank') {
                    wordBankQuestions = data.word_bank_questions || [];
                    if (wordBankQuestions.length === 0) { showError('No Word Bank questions.'); return; }
                    wordBankAnswers = {};
                    startTimer();
                    renderWordBankView(false);
                    return;
                }

                // MCQ (existing)
                questions = data.questions || [];
                if (questions.length === 0) { showError('No questions.'); return; }
                currentQuestionIndex = 0;
                startTimer();
                renderStudentQuestion();
            } catch (error) { showError('Unexpected Error: ' + error.message); }
        }

        // ============================================================
        // MCQ STUDENT VIEW (existing)
        // ============================================================

        function renderStudentQuestion() {
            const totalQuestions = questions.length;
            const questionNumber = currentQuestionIndex + 1;
            const question = questions[currentQuestionIndex];

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'].filter(key => question.options[key] && question.options[key].trim() !== '');
            optionKeys.forEach(key => {
                const selected = studentAnswers[question.id] === key ? 'selected' : '';
                optionsHtml += `
                    <button class="academic-option-button ${selected}" onclick="selectStudentAnswer(${question.id}, '${key}')">
                        <span class="academic-option-letter">${key}</span>
                        <span class="academic-option-text">${question.options[key]}</span>
                    </button>
                `;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 24px 20px;">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <h1 style="color: #f9fafb; font-size: 20px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">${exam.title}</p>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <span style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Question ${questionNumber} of ${totalQuestions}</span>
                        <span class="academic-timer" id="academicTimer" style="color: #f9fafb; font-size: 14px; font-weight: 600;">${formatTime(remainingSeconds)}</span>
                    </div>

                    <div class="academic-progress-bar" style="margin-bottom: 24px;">
                        <div class="academic-progress-fill" style="width: ${(questionNumber / totalQuestions) * 100}%;"></div>
                    </div>

                    <h2 class="academic-question-text">${question.question_text}</h2>

                    <div class="academic-options-container">
                        ${optionsHtml}
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button class="academic-secondary-btn" style="flex: 1;" onclick="studentPrevious()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>▸ Previous</button>
                        <button class="academic-primary-btn" style="flex: 1;" onclick="studentNext()">
                            ${currentQuestionIndex === totalQuestions - 1 ? 'Submit Exam' : 'Next ▸'}
                        </button>
                    </div>

                    <div id="examStatus" style="margin-top: 16px; color: #9ca3af; text-align: center; font-size: 13px;"></div>
                </div>
            `;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function selectStudentAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderStudentQuestion();
        }

        function studentPrevious() {
            if (currentQuestionIndex > 0 && !isSubmitting) {
                currentQuestionIndex--;
                renderStudentQuestion();
            }
        }

        async function studentNext() {
            if (isSubmitting) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderStudentQuestion();
                return;
            }
            await submitStudentExam();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingSeconds--;
                const timerEl = document.getElementById('academicTimer');
                
                if (timerEl) {
                    timerEl.textContent = formatTime(remainingSeconds);
                    
                    if (remainingSeconds <= 60 && remainingSeconds > 0) {
                        timerEl.classList.add('timer-warning');
                    }
                }
                
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    autoSubmitOnTimeout();
                    return;
                }
            }, 1000);
        }

        async function autoSubmitOnTimeout() {
            if (isSubmitting) return;
            isSubmitting = true;

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 60px 24px; text-align: center;">
                    <div style="font-size: 64px; margin-bottom: 20px;">⏱</div>
                    <h1 style="color: #fca5a5; font-size: 22px; font-weight: 700; margin: 0 0 16px 0;">Time is Up!</h1>
                    <p style="color: #9ca3af; font-size: 15px; margin: 0;">Submitting your exam automatically...</p>
                    <div style="margin-top: 32px;">
                        <div class="academic-progress-bar" style="width: 200px; margin: 0 auto;">
                            <div class="academic-progress-fill" style="width: 100%; background: #f59e0b;"></div>
                        </div>
                    </div>
                </div>
            `;

            try {
                await performSubmit(true);
            } catch (error) {
                document.querySelector('.exam-card').innerHTML = `
                    <div style="padding: 40px 24px; text-align: center;">
                        <div style="font-size: 56px; margin-bottom: 16px;">⚠️</div>
                        <h1 style="color: #fca5a5; font-size: 20px; font-weight: 700; margin: 0 0 16px 0;">Time is Up</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 0 0 20px 0;">${error.message || 'Could not submit automatically.'}</p>
                        <button class="academic-primary-btn" onclick="retryAutoSubmit()">Try Submitting Manually</button>
                    </div>
                `;
                isSubmitting = false;
            }
        }

        async function retryAutoSubmit() {
            isSubmitting = false;
            await autoSubmitOnTimeout();
        }

        async function submitStudentExam() {
            if (isSubmitting) return;
            const confirmed = confirm('Are you sure you want to submit?');
            if (!confirmed) return;
            isSubmitting = true;
            const statusEl = document.getElementById('examStatus');
            if (statusEl) statusEl.textContent = 'Submitting...';
            try {
                await performSubmit(false);
            } catch (error) {
                isSubmitting = false;
                if (statusEl) statusEl.textContent = error.message || 'Could not submit.';
            }
        }

        async function performSubmit(wasAutoSubmitted) {
            let payload;
            if (exam.exam_type === 'word_bank') {
                payload = {
                    exam_id: Number(examId),
                    word_bank_answers: wordBankAnswers,
                    started_at: startedAt
                };
            } else {
                payload = {
                    exam_id: Number(examId),
                    answers: studentAnswers,
                    started_at: startedAt
                };
            }

            const response = await fetch('/api/exam/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                let message = `Failed (HTTP ${response.status})`;
                try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                throw new Error(message);
            }
            const data = await response.json();
            if (data.status !== 'success') throw new Error(data.message || 'Failed.');
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            renderStudentResult(data.result, wasAutoSubmitted);
        }

        function renderStudentResult(result, wasAutoSubmitted) {
            const score = result.score;
            const total = result.total_questions;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            const message = wasAutoSubmitted
                ? '⏱ Your exam was submitted automatically because time ran out.'
                : 'Your result has been saved and sent to the teacher.';
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 40px 24px; text-align: center;">
                    <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
                    <h1 style="color: #60a5fa; font-size: 24px; font-weight: 700; margin: 0 0 24px 0;">Exam Completed</h1>
                    <div class="academic-result-score" style="font-size: 56px; font-weight: 800; color: #f9fafb; margin: 16px 0;">${score} / ${total}</div>
                    <div class="academic-result-percentage" style="font-size: 28px; font-weight: 700; color: #34d399; margin-top: 12px;">${percentage}%</div>
                    <p style="color: #9ca3af; font-size: 14px; margin-top: 24px;">${message}</p>
                </div>
            `;
        }

               // ============================================================
        // WORD BANK — RENDER + DRAG & DROP
        // ============================================================
        //
        // Architecture:
        //   1. Server sends sentences WITH "_____" placeholder
        //   2. Frontend splits sentence by "_____" into [before, after]
        //   3. Renders blank as a drop target
        //   4. Word Bank chips are draggable
        //   5. On drop, word goes into blank; chip becomes "used"
        //   6. Clicking a filled blank returns the word to the bank
        // ============================================================

        let wbDragged = null;
        let wbDragGhost = null;
        let wbDragOffsetX = 0;
        let wbDragOffsetY = 0;

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function finishWordBankPreview() {
            // In preview mode, count how many sentences have a word placed.
            const wb = wordBankQuestions[currentWordBankIndex];
            if (!wb) { exitPreview(); return; }

            const wbId = String(wb.id);
            const placed = wordBankAnswers[wbId] || {};
            const answered = Object.keys(placed).length;
            const total = wb.questions.length;

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 0;">
                    <div class="preview-banner">
                        <span>⚠️ Preview Mode - Results will NOT be saved</span>
                        <button class="preview-exit-btn" onclick="exitPreview()">Exit Preview</button>
                    </div>
                    <div style="padding: 40px 24px; text-align: center;">
                        <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
                        <h1 style="color: #60a5fa; font-size: 24px; font-weight: 700; margin: 0 0 16px 0;">Preview Completed!</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 0;">You answered ${answered} out of ${total} sentences.</p>
                        <p style="color: #6b7280; font-size: 13px; margin: 16px 0;">(No results were saved)</p>
                        <button class="academic-primary-btn" style="margin-top: 24px;" onclick="exitPreview()">Exit Preview</button>
                    </div>
                </div>
            `;
        }
        function renderWordBankView(isPreview) {
            const wb = wordBankQuestions[currentWordBankIndex];
            if (!wb) { showError('Word Bank question not found.'); return; }

            const wbId = String(wb.id);

            if (!wordBankAnswers[wbId]) {
                wordBankAnswers[wbId] = {};
            }

            if (!wb._shuffledWords) {
                wb._shuffledWords = shuffleArray(wb.word_bank);
            }

            const placedWords = Object.values(wordBankAnswers[wbId]);

            const bannerHtml = isPreview
                ? `<div class="preview-banner">
                       <span>⚠️ Preview Mode - Results will NOT be saved</span>
                       <button class="preview-exit-btn" onclick="exitPreview()">Exit Preview</button>
                   </div>`
                : '';

            // ----- Build sentences -----
            let sentencesHtml = '';
            wb.questions.forEach(q => {
                const num = String(q.number);
                const placed = wordBankAnswers[wbId][num];
                const sentenceText = q.sentence || '';

                // Split on "_____" placeholder
                const parts = sentenceText.split('_____');
                const before = escapeHtml(parts[0] || '');
                const after = escapeHtml(parts[1] || '');

                const blankHtml = placed
                    ? `<span class="wb-blank wb-blank-filled" 
                             data-qid="${wbId}" 
                             data-num="${num}"
                             onclick="removeWordFromBlank('${wbId}', '${num}')">${escapeHtml(placed)}</span>`
                    : `<span class="wb-blank" 
                             data-qid="${wbId}" 
                             data-num="${num}">_____</span>`;

                sentencesHtml += `
                    <div class="wb-sentence">
                        <span class="wb-num">${q.number}.</span>
                        <span class="wb-text">${before}${blankHtml}${after}</span>
                    </div>
                `;
            });

            // ----- Build word bank chips -----
            let chipsHtml = '';
            wb._shuffledWords.forEach(word => {
                const isUsed = placedWords.includes(word);
                chipsHtml += `
                    <div class="wb-chip${isUsed ? ' wb-chip-used' : ''}" 
                         data-word="${escapeHtml(word)}"
                         data-qid="${wbId}"
                         ${isUsed ? '' : `onpointerdown="wbStartDrag(event, '${escapeHtml(word)}', '${wbId}')"`}>
                        ${escapeHtml(word)}
                    </div>
                `;
            });

            const instruction = wb.instruction || 'Complete each sentence using a word from the box. There is ONE extra word.';
            // Enable sticky positioning for the Word Bank only
            document.querySelector('.exam-card').style.overflow = 'visible';

            document.querySelector('.exam-card').innerHTML = `
                <div class="wb-wrapper">
                    ${bannerHtml}
                    <div class="wb-inner">
                        ${isPreview ? '' : `
                            <div class="wb-header">
                                <h1 class="wb-title">YEnglish Exams</h1>
                                <span class="academic-timer" id="academicTimer">${formatTime(remainingSeconds)}</span>
                            </div>
                            <p class="wb-exam-title">${escapeHtml(exam.title)}</p>
                        `}

                        <div class="wb-instruction">${escapeHtml(instruction)}</div>

                        <div class="wb-word-bank">
                            <div class="wb-bank-label">📦 Word Bank</div>
                            <div class="wb-bank-chips">
                                ${chipsHtml}
                            </div>
                        </div>

                        <div class="wb-sentences">
                            ${sentencesHtml}
                        </div>

                        ${isPreview ? `
                            <button class="academic-primary-btn wb-submit-btn" onclick="finishWordBankPreview()">
                                Finish Preview
                            </button>
                        ` : `
                            <button class="academic-primary-btn wb-submit-btn" onclick="submitStudentExam()">
                                ✓ Submit Exam
                            </button>
                            <div id="examStatus" class="wb-status"></div>
                        `}
                    </div>
                </div>
            `;
        }

        function removeWordFromBlank(qid, num) {
            if (!wordBankAnswers[qid]) return;
            delete wordBankAnswers[qid][num];
            renderWordBankView(isPreviewMode);
        }

        // ------------------------------------------------------------
        // Drag & Drop via Pointer Events (works on mobile + desktop)
        // ------------------------------------------------------------

        function wbStartDrag(event, word, qid) {
            event.preventDefault();
            wbDragged = { word: word, qid: qid };

            // Create floating ghost element
            wbDragGhost = document.createElement('div');
            wbDragGhost.className = 'wb-drag-ghost';
            wbDragGhost.textContent = word;
            document.body.appendChild(wbDragGhost);

            const rect = event.target.getBoundingClientRect();
            wbDragOffsetX = event.clientX - rect.left;
            wbDragOffsetY = event.clientY - rect.top;

            wbDragGhost.style.left = (event.clientX - wbDragOffsetX) + 'px';
            wbDragGhost.style.top = (event.clientY - wbDragOffsetY) + 'px';

            event.target.classList.add('wb-chip-dragging');

            document.addEventListener('pointermove', wbPointerMove);
            document.addEventListener('pointerup', wbPointerUp);
            document.addEventListener('pointercancel', wbPointerUp);
        }

        function wbPointerMove(event) {
            if (!wbDragged || !wbDragGhost) return;
            event.preventDefault();

            wbDragGhost.style.left = (event.clientX - wbDragOffsetX) + 'px';
            wbDragGhost.style.top = (event.clientY - wbDragOffsetY) + 'px';

            // Highlight target blank
            document.querySelectorAll('.wb-blank').forEach(b => b.classList.remove('wb-blank-over'));
            const under = document.elementFromPoint(event.clientX, event.clientY);
            const blank = under?.closest?.('.wb-blank');
            if (blank && !blank.classList.contains('wb-blank-filled')) {
                blank.classList.add('wb-blank-over');
            }
        }

        function wbPointerUp(event) {
            if (!wbDragged) return;
            event.preventDefault();

            document.removeEventListener('pointermove', wbPointerMove);
            document.removeEventListener('pointerup', wbPointerUp);
            document.removeEventListener('pointercancel', wbPointerUp);

            if (wbDragGhost) {
                wbDragGhost.remove();
                wbDragGhost = null;
            }

            document.querySelectorAll('.wb-blank').forEach(b => b.classList.remove('wb-blank-over'));
            document.querySelectorAll('.wb-chip').forEach(c => c.classList.remove('wb-chip-dragging'));

            const under = document.elementFromPoint(event.clientX, event.clientY);
            const blank = under?.closest?.('.wb-blank');

            if (blank && !blank.classList.contains('wb-blank-filled')) {
                const qid = blank.dataset.qid;
                const num = blank.dataset.num;
                const word = wbDragged.word;

                // Remove any previous word in this blank
                if (wordBankAnswers[qid][num]) {
                    delete wordBankAnswers[qid][num];
                }

                // Place the word
                wordBankAnswers[qid][num] = word;

                wbDragged = null;
                renderWordBankView(isPreviewMode);
                return;
            }

            wbDragged = null;
            renderWordBankView(isPreviewMode);
        }

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                const userData = await fetchAPI('/api/me');
                if (userData.status !== 'success') { showError(userData.message || 'Auth failed.'); return; }
                USER_DATA = userData;
                if (userData.is_teacher) {
                    renderDashboard(userData);
                } else {
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    examId = null;
                    if (startParam && startParam.startsWith('exam_')) examId = startParam.substring(5);
                    if (!examId) { showError('Exam ID not received.'); return; }
                    await loadStudentExam(examId);
                }
            } catch (error) { showError('Unable to start.'); }
        }

        function showError(message) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <h1 style="color: #fca5a5; font-size: 18px;">Error</h1>
                    <p style="color: #9ca3af; font-size: 14px;">${message}</p>
                    <button class="academic-primary-btn" style="margin-top: 20px;" onclick="startApp()">Try Again</button>
                </div>
            `;
        }

        startApp();
    </script>

</body>
