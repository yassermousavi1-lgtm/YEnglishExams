<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YEnglish Exams</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>

    <main class="app-container">

        <section class="exam-card">

            <!-- ==================================================
                 EXAM HEADER
                 ================================================== -->

            <header class="exam-header">

                <div class="exam-title-section">

                    <div class="exam-icon">
                        📝
                    </div>

                    <div>

                        <h1 id="examTitle">
                            Loading...
                        </h1>

                        <p id="welcomeText">
                            Authenticating...
                        </p>

                    </div>

                </div>


                <div
                    id="timer"
                    class="timer"
                >
                    00:00
                </div>

            </header>


            <!-- ==================================================
                 PROGRESS
                 ================================================== -->

            <div class="progress-section">

                <div class="progress-info">

                    <span id="questionProgress">
                        Question 1 of 1
                    </span>

                </div>


                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- ==================================================
                 QUESTION
                 ================================================== -->

            <section
                id="questionContainer"
                class="question-container"
            >

            </section>


            <!-- ==================================================
                 NAVIGATION
                 ================================================== -->

            <div class="navigation">

                <button
                    id="previousButton"
                    class="secondary-button"
                    type="button"
                >
                    ← Previous
                </button>


                <button
                    id="nextButton"
                    class="primary-button"
                    type="button"
                >
                    Next →
                </button>

            </div>


            <!-- ==================================================
                 STATUS
                 ================================================== -->

            <div
                id="status"
                class="status"
            >
                Authenticating with Telegram...
            </div>

        </section>

    </main>


    <script>

        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram =
            window.Telegram?.WebApp;


        if (telegram) {

            telegram.ready();

            telegram.expand();

        }


        // ============================================================
        // TELEGRAM USER
        // ============================================================

        const telegramUser =
            telegram?.initDataUnsafe?.user;


        const welcomeTextElement =
            document.getElementById(
                "welcomeText"
            );


        if (telegramUser) {

            const firstName =
                telegramUser.first_name ||
                "Student";


            welcomeTextElement.textContent =
                `Welcome ${firstName}`;

        }
        else {

            welcomeTextElement.textContent =
                "Telegram user not available.";

        }


        // ============================================================
        // EXAM ID
        // ============================================================

        const startParameter =
            telegram?.initDataUnsafe?.start_param ||
            null;


        let examId = null;


        if (
            startParameter &&
            startParameter.startsWith("exam_")
        ) {

            examId =
                startParameter.substring(5);

        }


        // ============================================================
        // API
        // ============================================================
        //
        // The Mini App and API are served by the same Flask server.
        //
        // Therefore all API requests use relative URLs.
        // ============================================================

        const API_BASE_URL = "";


        // ============================================================
        // EXAM DATA
        // ============================================================

        let exam = null;

        let questions = [];

        let currentQuestionIndex = 0;


        /*
         * Answers are keyed by question ID.
         *
         * Example:
         *
         * {
         *     "1": "B",
         *     "3": "A"
         * }
         */

        const studentAnswers = {};


        // ============================================================
        // AUTHENTICATED STUDENT
        // ============================================================

        /*
         * This object is populated ONLY after Flask validates
         * Telegram initData.
         */

        let authenticatedStudent = null;


        // ============================================================
        // TIME
        // ============================================================

        let remainingSeconds = 0;

        let timerInterval = null;

        let startedAt = null;


        // ============================================================
        // SUBMISSION STATE
        // ============================================================

        let isSubmitting = false;


        // ============================================================
        // DOM
        // ============================================================

        const examTitleElement =
            document.getElementById(
                "examTitle"
            );


        const questionProgressElement =
            document.getElementById(
                "questionProgress"
            );


        const progressFillElement =
            document.getElementById(
                "progressFill"
            );


        const questionContainer =
            document.getElementById(
                "questionContainer"
            );


        const previousButton =
            document.getElementById(
                "previousButton"
            );


        const nextButton =
            document.getElementById(
                "nextButton"
            );


        const timerElement =
            document.getElementById(
                "timer"
            );


        const statusElement =
            document.getElementById(
                "status"
            );


        // ============================================================
        // AUTHENTICATE STUDENT
        // ============================================================

        async function authenticateStudent() {

            /*
             * A Mini App opened inside Telegram provides:
             *
             *     telegram.initData
             *
             * This raw signed data is sent to Flask.
             *
             * Flask verifies the signature using the Bot Token.
             */

            if (!telegram) {

                throw new Error(
                    "Telegram WebApp API is not available."
                );

            }


            if (!telegram.initData) {

                throw new Error(
                    "Telegram authentication data is missing."
                );

            }


            statusElement.textContent =
                "Authenticating with Telegram...";


            const response =
                await fetch(
                    `${API_BASE_URL}/api/me`,
                    {
                        method: "GET",

                        headers: {
                            "X-Telegram-Init-Data":
                                telegram.initData
                        }
                    }
                );


            if (!response.ok) {

                let message =
                    `Authentication failed (HTTP ${response.status}).`;


                try {

                    const errorData =
                        await response.json();


                    if (errorData.message) {

                        message =
                            errorData.message;

                    }

                }
                catch (error) {

                    /*
                     * Keep the HTTP error message if the response
                     * cannot be parsed as JSON.
                     */

                }


                throw new Error(
                    message
                );

            }


            const data =
                await response.json();


            if (
                data.status !==
                "success"
            ) {

                throw new Error(
                    data.message ||
                    "Telegram authentication failed."
                );

            }


            authenticatedStudent =
                data.student;


            /*
             * We now have a student record identified by the
             * server.
             *
             * We NEVER obtain this ID from the browser manually.
             */

            return data;

        }


        // ============================================================
        // LOAD EXAM
        // ============================================================

        async function loadExam() {

            if (!examId) {

                throw new Error(
                    "Exam ID was not received from Telegram."
                );

            }


            statusElement.textContent =
                "Loading exam...";


            const response =
                await fetch(
                    `${API_BASE_URL}/api/exam/${examId}/questions`,
                    {
                        method: "GET",

                        headers: {
                            "X-Telegram-Init-Data":
                                telegram.initData
                        }
                    }
                );


            if (!response.ok) {

                let message =
                    `Exam request failed (HTTP ${response.status}).`;


                try {

                    const errorData =
                        await response.json();


                    if (errorData.message) {

                        message =
                            errorData.message;

                    }

                }
                catch (error) {

                    /*
                     * Keep default HTTP error.
                     */

                }


                throw new Error(
                    message
                );

            }


            const data =
                await response.json();


            if (
                data.status !==
                "success"
            ) {

                throw new Error(
                    data.message ||
                    "Unable to load exam."
                );

            }


            exam =
                data.exam;


            questions =
                data.questions || [];


            if (
                questions.length === 0
            ) {

                throw new Error(
                    "This exam has no questions."
                );

            }


            // --------------------------------------------------------
            // Start time
            // --------------------------------------------------------

            startedAt =
                new Date().toISOString();


            // --------------------------------------------------------
            // Exam title
            // --------------------------------------------------------

            examTitleElement.textContent =
                exam.title;


            // --------------------------------------------------------
            // Timer
            // --------------------------------------------------------

            remainingSeconds =
                Number(
                    exam.time_limit
                ) * 60;


            startTimer();


            // --------------------------------------------------------
            // First question
            // --------------------------------------------------------

            currentQuestionIndex =
                0;


            renderCurrentQuestion();


            statusElement.textContent =
                "";

        }


        // ============================================================
        // RENDER CURRENT QUESTION
        // ============================================================

        function renderCurrentQuestion() {

            if (!questions.length) {

                return;

            }


            const question =
                questions[
                    currentQuestionIndex
                ];


            // --------------------------------------------------------
            // Progress
            // --------------------------------------------------------

            const questionNumber =
                currentQuestionIndex + 1;


            const totalQuestions =
                questions.length;


            questionProgressElement.textContent =
                `Question ${questionNumber} of ${totalQuestions}`;


            const progressPercentage =
                (
                    questionNumber /
                    totalQuestions
                ) * 100;


            progressFillElement.style.width =
                `${progressPercentage}%`;


            // --------------------------------------------------------
            // Clear previous question
            // --------------------------------------------------------

            questionContainer.innerHTML =
                "";


            // --------------------------------------------------------
            // Question number
            // --------------------------------------------------------

            const questionNumberElement =
                document.createElement(
                    "div"
                );


            questionNumberElement.className =
                "question-number";


            questionNumberElement.textContent =
                `Question ${questionNumber}`;


            questionContainer.appendChild(
                questionNumberElement
            );


            // --------------------------------------------------------
            // Question text
            // --------------------------------------------------------

            const questionTextElement =
                document.createElement(
                    "h2"
                );


            questionTextElement.className =
                "question-text";


            questionTextElement.textContent =
                question.question_text;


            questionContainer.appendChild(
                questionTextElement
            );


            // --------------------------------------------------------
            // Options
            // --------------------------------------------------------

            const optionsContainer =
                document.createElement(
                    "div"
                );


            optionsContainer.className =
                "options-container";


            const optionKeys =
                [
                    "A",
                    "B",
                    "C",
                    "D"
                ];


            optionKeys.forEach(
                function(optionKey) {

                    const optionButton =
                        document.createElement(
                            "button"
                        );


                    optionButton.type =
                        "button";


                    optionButton.className =
                        "option-button";


                    optionButton.dataset.option =
                        optionKey;


                    // ----------------------------------------------
                    // Option letter
                    // ----------------------------------------------

                    const letterElement =
                        document.createElement(
                            "span"
                        );


                    letterElement.className =
                        "option-letter";


                    letterElement.textContent =
                        optionKey;


                    // ----------------------------------------------
                    // Option text
                    // ----------------------------------------------

                    const textElement =
                        document.createElement(
                            "span"
                        );


                    textElement.className =
                        "option-text";


                    textElement.textContent =
                        question.options[
                            optionKey
                        ];


                    // ----------------------------------------------
                    // Build button
                    // ----------------------------------------------

                    optionButton.appendChild(
                        letterElement
                    );


                    optionButton.appendChild(
                        textElement
                    );


                    // ----------------------------------------------
                    // Restore selection
                    // ----------------------------------------------

                    if (
                        studentAnswers[
                            question.id
                        ] === optionKey
                    ) {

                        optionButton.classList.add(
                            "selected"
                        );

                    }


                    // ----------------------------------------------
                    // Selection event
                    // ----------------------------------------------

                    optionButton.addEventListener(
                        "click",
                        function() {

                            selectAnswer(
                                question.id,
                                optionKey
                            );

                        }
                    );


                    optionsContainer.appendChild(
                        optionButton
                    );

                }
            );


            questionContainer.appendChild(
                optionsContainer
            );


            updateNavigationButtons();

        }


        // ============================================================
        // SELECT ANSWER
        // ============================================================

        function selectAnswer(
            questionId,
            optionKey
        ) {

            studentAnswers[
                questionId
            ] =
                optionKey;


            renderCurrentQuestion();

        }


        // ============================================================
        // PREVIOUS BUTTON
        // ============================================================

        previousButton.addEventListener(
            "click",
            function() {

                if (
                    currentQuestionIndex > 0 &&
                    !isSubmitting
                ) {

                    currentQuestionIndex--;

                    renderCurrentQuestion();

                }

            }
        );


        // ============================================================
        // NEXT / SUBMIT
        // ============================================================

        nextButton.addEventListener(
            "click",
            async function() {

                if (isSubmitting) {

                    return;

                }


                // ----------------------------------------------------
                // Go to next question
                // ----------------------------------------------------

                if (
                    currentQuestionIndex <
                    questions.length - 1
                ) {

                    currentQuestionIndex++;

                    renderCurrentQuestion();

                    return;

                }


                // ----------------------------------------------------
                // Last question = Submit
                // ----------------------------------------------------

                const confirmed =
                    window.confirm(
                        "Are you sure you want to submit the exam?"
                    );


                if (!confirmed) {

                    return;

                }


                await submitExam();

            }
        );


        // ============================================================
        // NAVIGATION STATE
        // ============================================================

        function updateNavigationButtons() {

            previousButton.disabled =
                currentQuestionIndex === 0 ||
                isSubmitting;


            if (
                currentQuestionIndex ===
                questions.length - 1
            ) {

                nextButton.textContent =
                    "Submit Exam";

            }
            else {

                nextButton.textContent =
                    "Next →";

            }


            nextButton.disabled =
                isSubmitting;

        }


        // ============================================================
        // SUBMIT EXAM
        // ============================================================

        async function submitExam() {

            if (isSubmitting) {

                return;

            }


            isSubmitting =
                true;


            updateNavigationButtons();


            statusElement.textContent =
                "Submitting exam...";


            try {

                /*
                 * IMPORTANT:
                 *
                 * There is NO student_id here.
                 *
                 * The server identifies the student from the
                 * validated Telegram initData.
                 */

                const payload = {

                    exam_id:
                        Number(examId),

                    answers:
                        studentAnswers,

                    started_at:
                        startedAt

                };


                const response =
                    await fetch(
                        `${API_BASE_URL}/api/exam/submit`,
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "X-Telegram-Init-Data":
                                    telegram.initData
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                if (!response.ok) {

                    let message =
                        `Submission failed (HTTP ${response.status}).`;


                    try {

                        const errorData =
                            await response.json();


                        if (errorData.message) {

                            message =
                                errorData.message;

                        }

                    }
                    catch (error) {

                        /*
                         * Keep default HTTP error.
                         */

                    }


                    throw new Error(
                        message
                    );

                }


                const data =
                    await response.json();


                if (
                    data.status !==
                    "success"
                ) {

                    throw new Error(
                        data.message ||
                        "Submission failed."
                    );

                }


                // ----------------------------------------------------
                // Stop timer
                // ----------------------------------------------------

                if (timerInterval) {

                    clearInterval(
                        timerInterval
                    );

                    timerInterval =
                        null;

                }


                // ----------------------------------------------------
                // Show server result
                // ----------------------------------------------------

                showResult(
                    data.result
                );

            }
            catch (error) {

                console.error(
                    "Submission error:",
                    error
                );


                isSubmitting =
                    false;


                updateNavigationButtons();


                statusElement.textContent =
                    error.message ||
                    "Could not submit the exam.";

            }

        }


        // ============================================================
        // RESULT
        // ============================================================

        function showResult(result) {

            const score =
                result.score;


            const total =
                result.total_questions;


            const percentage =
                total > 0
                    ? Math.round(
                        (
                            score /
                            total
                        ) * 100
                    )
                    : 0;


            examTitleElement.textContent =
                "Exam Completed";


            questionProgressElement.textContent =
                "Result";


            progressFillElement.style.width =
                "100%";


            questionContainer.innerHTML =
                "";


            const resultBox =
                document.createElement(
                    "div"
                );


            resultBox.className =
                "result-box";


            const resultTitle =
                document.createElement(
                    "h2"
                );


            resultTitle.textContent =
                "Your Result";


            const scoreElement =
                document.createElement(
                    "div"
                );


            scoreElement.className =
                "result-score";


            scoreElement.textContent =
                `${score} / ${total}`;


            const percentageElement =
                document.createElement(
                    "div"
                );


            percentageElement.className =
                "result-percentage";


            percentageElement.textContent =
                `${percentage}%`;


            resultBox.appendChild(
                resultTitle
            );


            resultBox.appendChild(
                scoreElement
            );


            resultBox.appendChild(
                percentageElement
            );


            questionContainer.appendChild(
                resultBox
            );


            previousButton.style.display =
                "none";


            nextButton.style.display =
                "none";


            timerElement.textContent =
                "DONE";


            statusElement.textContent =
                "Your exam has been submitted successfully.";

        }


        // ============================================================
        // TIMER
        // ============================================================

        function startTimer() {

            if (timerInterval) {

                clearInterval(
                    timerInterval
                );

            }


            updateTimerDisplay();


            timerInterval =
                setInterval(
                    function() {

                        remainingSeconds--;


                        updateTimerDisplay();


                        if (
                            remainingSeconds <= 0
                        ) {

                            clearInterval(
                                timerInterval
                            );


                            timerInterval =
                                null;


                            timerElement.textContent =
                                "00:00";


                            isSubmitting =
                                true;


                            updateNavigationButtons();


                            statusElement.textContent =
                                "Time is up.";

                        }

                    },
                    1000
                );

        }


        // ============================================================
        // TIMER DISPLAY
        // ============================================================

        function updateTimerDisplay() {

            const minutes =
                Math.floor(
                    remainingSeconds /
                    60
                );


            const seconds =
                remainingSeconds %
                60;


            const minutesText =
                String(minutes)
                    .padStart(
                        2,
                        "0"
                    );


            const secondsText =
                String(seconds)
                    .padStart(
                        2,
                        "0"
                    );


            timerElement.textContent =
                `${minutesText}:${secondsText}`;


            if (
                remainingSeconds <= 60
            ) {

                timerElement.classList.add(
                    "timer-warning"
                );

            }
            else {

                timerElement.classList.remove(
                    "timer-warning"
                );

            }

        }


        // ============================================================
        // ERROR DISPLAY
        // ============================================================

        function showError(message) {

            examTitleElement.textContent =
                "Unable to Load Exam";


            questionContainer.innerHTML =
                "";


            statusElement.textContent =
                message;


            previousButton.disabled =
                true;


            nextButton.disabled =
                true;

        }


        // ============================================================
        // APPLICATION START
        // ============================================================

        async function startApplication() {

            try {

                // ----------------------------------------------------
                // Step 1:
                // Authenticate with Telegram.
                // ----------------------------------------------------

                await authenticateStudent();


                // ----------------------------------------------------
                // Step 2:
                // Load requested exam.
                // ----------------------------------------------------

                await loadExam();

            }
            catch (error) {

                console.error(
                    "Application startup error:",
                    error
                );


                showError(
                    error.message ||
                    "Unable to start the exam."
                );

            }

        }


        startApplication();

    </script>

</body>

</html>
