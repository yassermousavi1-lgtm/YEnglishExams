<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card" id="appRoot">
            <!-- محتوای صفحه توسط JavaScript ساخته می‌شود -->
        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const appRoot = document.getElementById('appRoot');

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            const response = await fetch(endpoint, {
                ...options,
                headers: {
                    ...options.headers,
                    'X-Telegram-Init-Data': telegram?.initData || ''
                }
            });
            return response.json();
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        function renderTeacherDashboard(userData) {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">👨‍🏫</div>
                    <h1 style="color: #f9fafb;">Teacher Panel</h1>
                    <p style="color: #9ca3af;">Welcome, ${userData.telegram_user.first_name}!</p>
                    <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button class="primary-button" style="padding: 16px;" onclick="alert('Students list coming soon!')">👥 Students</button>
                        <button class="primary-button" style="padding: 16px;" onclick="alert('Exams list coming soon!')">📝 Exams</button>
                        <button class="primary-button" style="padding: 16px;" onclick="alert('Results coming soon!')">📊 Results</button>
                        <button class="primary-button" style="padding: 16px;" onclick="alert('Add student coming soon!')">➕ Add Student</button>
                    </div>
                    <p style="color: #6b7280; margin-top: 30px; font-size: 14px;">More features coming soon...</p>
                </div>
            `;
        }

        function renderStudentExam() {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">📚</div>
                    <h1 style="color: #f9fafb;">Loading Exam...</h1>
                    <p style="color: #9ca3af;">Please wait while we prepare your exam.</p>
                    <div style="margin-top: 20px; display: flex; justify-content: center;">
                        <div style="width: 40px; height: 40px; border: 4px solid #374151; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    </div>
                    <style>
                        @keyframes spin {
                            to { transform: rotate(360deg); }
                        }
                    </style>
                </div>
            `;
        }

        function renderError(message) {
            appRoot.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 48px; margin-bottom: 10px;">⚠️</div>
                    <h1 style="color: #fca5a5;">Error</h1>
                    <p style="color: #9ca3af;">${message}</p>
                </div>
            `;
        }

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                // Step 1: Authenticate and get user info
                const userData = await fetchAPI('/api/me');

                if (userData.status !== 'success') {
                    renderError(userData.message || 'Authentication failed.');
                    return;
                }

                // Step 2: Check if user is teacher or student
                if (userData.is_teacher) {
                    renderTeacherDashboard(userData);
                } else {
                    renderStudentExam();

                    // For students, check if exam_id is provided
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    let examId = null;
                    if (startParam && startParam.startsWith('exam_')) {
                        examId = startParam.substring(5);
                    }

                    if (!examId) {
                        renderError('Exam ID was not received from Telegram.');
                        return;
                    }

                    // Load the exam (this will redirect to the existing exam logic)
                    // For now, we just show a loading message
                    setTimeout(() => {
                        renderStudentExam();
                    }, 500);
                }

            } catch (error) {
                console.error('App error:', error);
                renderError('Unable to start the application.');
            }
        }

        // ============================================================
        // START
        // ============================================================

        startApp();
    </script>

</body>

</html>
