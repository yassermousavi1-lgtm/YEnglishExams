<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEnglish Exams</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <main class="app-container">
        <section class="exam-card" id="mainCard">

            <header class="exam-header">
                <div class="exam-title-section">
                    <div class="exam-icon">📝</div>
                    <div>
                        <h1 id="examTitle">Loading...</h1>
                        <p id="welcomeText">Authenticating...</p>
                    </div>
                </div>
                <div id="timer" class="timer">00:00</div>
            </header>

            <div class="progress-section">
                <div class="progress-info">
                    <span id="questionProgress">Question 1 of 1</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <section id="questionContainer" class="question-container"></section>

            <div class="navigation">
                <button id="previousButton" class="secondary-button" type="button">← Previous</button>
                <button id="nextButton" class="primary-button" type="button">Next →</button>
            </div>

            <div id="status" class="status">Authenticating with Telegram...</div>

        </section>
    </main>

    <script>
        // ============================================================
        // TELEGRAM INITIALIZATION
        // ============================================================

        const telegram = window.Telegram?.WebApp;

        if (telegram) {
            telegram.ready();
            telegram.expand();
        }

        // ============================================================
        // DOM REFERENCE
        // ============================================================

        const mainCard = document.getElementById('mainCard');
        const examTitleElement = document.getElementById('examTitle');
        const welcomeTextElement = document.getElementById('welcomeText');
        const timerElement = document.getElementById('timer');
        const questionProgressElement = document.getElementById('questionProgress');
        const progressFillElement = document.getElementById('progressFill');
        const questionContainer = document.getElementById('questionContainer');
        const previousButton = document.getElementById('previousButton');
        const nextButton = document.getElementById('nextButton');
        const statusElement = document.getElementById('status');

        // ============================================================
        // STATE
        // ============================================================

        let USER_DATA = null;
        let exam = null;
        let questions = [];
        let currentQuestionIndex = 0;
        let studentAnswers = {};
        let remainingSeconds = 0;
        let timerInterval = null;
        let startedAt = null;
        let isSubmitting = false;
        let examId = null;
        let allGroups = [];
        let currentStudentId = null;
        let isPreviewMode = false;

        // ============================================================
        // TELEGRAM USER
        // ============================================================

        const telegramUser = telegram?.initDataUnsafe?.user;

        if (telegramUser) {
            welcomeTextElement.textContent = `Welcome ${telegramUser.first_name || 'Student'}`;
        } else {
            welcomeTextElement.textContent = 'Telegram user not available.';
        }

        // ============================================================
        // API HELPERS
        // ============================================================

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    }
                });
                const data = await response.json();
                if (data.status !== 'success') {
                    showError('API Error: ' + (data.message || 'Unknown error'));
                }
                return data;
            } catch (error) {
                showError('Network Error: ' + error.message);
                throw error;
            }
        }

        // ============================================================
        // ACADEMIC HEADER
        // ============================================================

        function academicHeader(title, backAction) {
            return `
                <button class="academic-back-button" onclick="${backAction}">▸ Back</button>
                <h2 class="academic-page-title">${title}</h2>
            `;
        }

        // ============================================================
        // RENDER FUNCTIONS (TEACHER)
        // ============================================================

        // ---------- Dashboard ----------
        function renderDashboard(userData) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 24px 20px;">
                    
                    <div style="text-align: center; margin-bottom: 32px;">
                        <h1 style="color: #f9fafb; font-size: 22px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">Teacher Dashboard</p>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Create</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="showAddStudent()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Student</span>
                            </button>
                            <button class="academic-menu-item" onclick="showAddGroup()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Add Group</span>
                            </button>
                            <button class="academic-menu-item" onclick="showCreateExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Create Exam</span>
                            </button>
                            <button class="academic-menu-item" onclick="showSendExam()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Send Exam</span>
                            </button>
                        </div>
                    </div>

                    <div style="margin-bottom: 28px;">
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Management</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <button class="academic-menu-item" onclick="loadStudents()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Students</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadExams()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Exams</span>
                            </button>
                            <button class="academic-menu-item" onclick="loadResults()">
                                <span style="color: #9ca3af; font-size: 16px;">▸</span>
                                <span>Results</span>
                            </button>
                        </div>
                    </div>

                    <p style="color: #4b5563; text-align: center; font-size: 12px; margin-top: 24px;">YEnglish Exams v2.0</p>
                </div>
            `;
        }

        // ---------- Students List ----------
        async function loadStudents() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading students...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/students');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load students.');
                    return;
                }
                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Students (' + data.total + ')', 'renderDashboard(USER_DATA)')}
                        <div style="margin-top: 16px;">
                `;
                if (data.students.length === 0) {
                    html += `<p style="color: #9ca3af;">No students registered yet.</p>`;
                } else {
                    data.students.forEach(s => {
                        html += `
                            <div class="academic-card" style="cursor: pointer;" onclick="showStudentProfile(${s.id})">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${s.first_name} ${s.last_name || ''}</strong>
                                        <span style="color: #9ca3af; font-size: 13px; display: block;">Telegram ID: ${s.telegram_user_id}</span>
                                        <span style="color: #60a5fa; font-size: 13px; display: block;">Group ID: ${s.group_id} | ${s.group_name}</span>
                                    </div>
                                    <div>
                                        <button class="academic-icon-btn danger" onclick="event.stopPropagation(); deleteStudent(${s.id})" title="Delete Student">✕</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading students.');
            }
        }

        // ---------- Show Student Profile ----------
        async function showStudentProfile(studentId) {
            currentStudentId = studentId;
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading profile...</p></div>`;
            try {
                const data = await fetchAPI(`/api/teacher/student/${studentId}`);
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load student profile.');
                    return;
                }
                const s = data.student;
                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Student Profile', 'loadStudents()')}
                        
                        <div class="academic-card" style="text-align: center; margin-bottom: 20px;">
                            <div style="font-size: 40px; margin-bottom: 8px;">👤</div>
                            <h3 style="color: #f9fafb; margin: 8px 0;">${s.first_name} ${s.last_name || ''}</h3>
                            <p style="color: #9ca3af; font-size: 13px; margin: 4px 0;">Telegram ID: ${s.telegram_user_id}</p>
                            <p style="color: #60a5fa; font-size: 13px; margin: 4px 0;">Group ID: ${s.group_id} | ${s.group_name}</p>
                        </div>
                        
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Archived Results (${data.total_results})</h3>
                `;

                if (data.results.length === 0) {
                    html += `<p style="color: #9ca3af; text-align: center; padding: 20px;">No archived results yet.</p>`;
                } else {
                    data.results.forEach(r => {
                        html += `
                            <div class="academic-card">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong style="color: #f9fafb;">${r.exam_title}</strong>
                                        <span style="color: #34d399; font-weight: 600; display: block;">Score: ${r.score}/${r.total_questions} (${r.percentage}%)</span>
                                        <span style="color: #9ca3af; font-size: 12px; display: block;">${r.completed_at || 'N/A'}</span>
                                    </div>
                                    <div>
                                        <button class="academic-icon-btn primary" onclick="shareResult(${r.id})" title="Share">📤</button>
                                        <button class="academic-icon-btn warning" onclick="unarchiveResult(${r.id}, ${studentId})" title="Unarchive">↩️</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                        <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #374151;">Attendance (${data.total_attendance})</h3>
                `;

                if (data.attendance.length === 0) {
                    html += `<p style="color: #9ca3af; text-align: center; padding: 20px;">No sessions recorded yet.</p>`;
                } else {
                    data.attendance.forEach(a => {
                        if (a.is_makeup) {
                            html += `
                                <div class="academic-card">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong style="color: #fbbf24;">Make-up session</strong>
                                            <span style="color: #9ca3af; font-size: 12px; display: block;">${a.created_at || 'N/A'}</span>
                                        </div>
                                        <div>
                                            <button class="academic-icon-btn warning" onclick="toggleMakeup(${a.id}, ${studentId})" title="Convert to Regular">🔄</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            const minutesText = a.extra_minutes > 0 ? `+${a.extra_minutes} min` : '';
                            html += `
                                <div class="academic-card">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong style="color: #f9fafb;">Session ${a.session_number}${minutesText ? ' ' + minutesText : ''}</strong>
                                            <span style="color: #9ca3af; font-size: 12px; display: block;">${a.created_at || 'N/A'}</span>
                                        </div>
                                        <div>
                                            <button class="academic-icon-btn primary" onclick="editMinutes(${a.id}, ${a.extra_minutes}, ${studentId})" title="Add/Edit Minutes">✏️</button>
                                            <button class="academic-icon-btn warning" onclick="toggleMakeup(${a.id}, ${studentId})" title="Convert to Make-up">🔄</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                html += `
                        <button class="academic-primary-btn" style="width: 100%; margin-top: 16px;" onclick="recordSession(${studentId}, ${data.total_attendance})">➕ Record New Session</button>
                    </div>
                `;

                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading student profile.');
            }
        }

        // ---------- Record Session ----------
        async function recordSession(studentId, totalAttendance) {
            if (totalAttendance === 0) {
                const firstSession = prompt('This is the first session. What is the session number?', '1');
                if (firstSession === null) return;
                const sessionNumber = parseInt(firstSession);
                if (isNaN(sessionNumber) || sessionNumber <= 0) {
                    alert('⚠️ Please enter a valid session number.');
                    return;
                }
                await addAttendance(studentId, sessionNumber);
            } else {
                await addAttendance(studentId, null);
            }
        }

        // ---------- Add Attendance API ----------
        async function addAttendance(studentId, sessionNumber) {
            try {
                const response = await fetch('/api/teacher/attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({
                        student_id: studentId,
                        session_number: sessionNumber
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showStudentProfile(studentId);
                } else if (data.need_first_session) {
                    const firstSession = prompt('This is the first session. What is the session number?', '1');
                    if (firstSession === null) return;
                    const sn = parseInt(firstSession);
                    if (isNaN(sn) || sn <= 0) {
                        alert('⚠️ Please enter a valid session number.');
                        return;
                    }
                    await addAttendance(studentId, sn);
                } else {
                    alert('❌ ' + (data.message || 'Failed to record session.'));
                }
            } catch (error) {
                alert('❌ Error recording session.');
            }
        }

        // ---------- Edit Minutes ----------
        async function editMinutes(attendanceId, currentMinutes, studentId) {
            const input = prompt('Add/Edit extra minutes (e.g. 5)', currentMinutes || '0');
            if (input === null) return;
            const minutes = parseInt(input);
            if (isNaN(minutes) || minutes < 0) {
                alert('⚠️ Please enter a valid number.');
                return;
            }
            try {
                const response = await fetch(`/api/teacher/attendance/${attendanceId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({ extra_minutes: minutes })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showStudentProfile(studentId);
                } else {
                    alert('❌ ' + (data.message || 'Failed to update minutes.'));
                }
            } catch (error) {
                alert('❌ Error updating minutes.');
            }
        }

        // ---------- Toggle Make-up ----------
        async function toggleMakeup(attendanceId, studentId) {
            if (!confirm('Convert this session to Make-up / Regular?')) return;
            try {
                const response = await fetch(`/api/teacher/attendance/${attendanceId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': telegram?.initData || ''
                    },
                    body: JSON.stringify({ toggle_makeup: true })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showStudentProfile(studentId);
                } else {
                    alert('❌ ' + (data.message || 'Failed to toggle.'));
                }
            } catch (error) {
                alert('❌ Error toggling.');
            }
        }

        // ---------- Delete Student ----------
        async function deleteStudent(studentId) {
            if (!confirm(`Are you sure you want to delete this student?`)) return;
            try {
                const response = await fetch('/api/teacher/students', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ student_id: studentId })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Student deleted successfully.');
                    loadStudents();
                } else {
                    alert('❌ ' + (data.message || 'Failed to delete student.'));
                }
            } catch (error) {
                alert('❌ Error deleting student.');
            }
        }

        // ---------- Exams List ----------
        async function loadExams() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading exams...</p></div>`;
            try {
                const data = await fetchAPI('/api/teacher/exams');
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load exams.');
                    return;
                }
                const grouped = {};
                data.exams.forEach(e => {
                    const cat = e.category || 'Uncategorized';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(e);
                });

                let html = `
                    <div style="padding: 20px;">
                        ${academicHeader('Exams (' + data.total + ')', 'renderDashboard(USER_DATA)')}
                `;
                if (data.exams.length === 0) {
                    html += `<p style="color: #9ca3af;">No exams created yet.</p>`;
                } else {
                    Object.keys(grouped).forEach(cat => {
                        html += `
                            <div style="margin-bottom: 20px;">
                                <h3 style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid #374151;">${cat}</h3>
                        `;
                        grouped[cat].forEach(e => {
                            html += `
                                <div class="academic-card">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <strong style="color: #f9fafb;">${e.title}</strong>
                                            <span style="color: #9ca3af; font-size: 13px; display: block;">ID: ${e.id} | Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                        </div>
                                        <div>
                                            <button class="academic-icon-btn primary" onclick="previewExam(${e.id})" title="Preview">👁</button>
                                            <button class="academic-icon-btn warning" onclick="showEditExam(${e.id})" title="Edit">✏️</button>
                                            <button class="academic-icon-btn danger" onclick="deleteExam(${e.id})" title="Delete">✕</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    });
                }
                html += `</div>`;
                document.querySelector('.exam-card').innerHTML = html;
            } catch (error) {
                showError('Error loading exams.');
            }
        }

        // ---------- Preview Exam ----------
        async function previewExam(examId) {
            isPreviewMode = true;
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading preview...</p></div>`;
            try {
                const response = await fetch(`/api/teacher/preview_exam/${examId}`, {
                    method: 'GET',
                    headers: { 'X-Telegram-Init-Data': telegram?.initData || '' }
                });
                if (!response.ok) {
                    showError('Failed to load preview.');
                    return;
                }
                const data = await response.json();
                if (data.status !== 'success') {
                    showError(data.message || 'Failed to load preview.');
                    return;
                }
                exam = data.exam;
                questions = data.questions || [];
                if (questions.length === 0) {
                    showError('This exam has no questions.');
                    return;
                }
                currentQuestionIndex = 0;
                studentAnswers = {};
                examId = data.exam.id;
                renderPreview();
            } catch (error) {
                showError('Error loading preview.');
            }
        }

        // ---------- Render Preview (Academic) ----------
        function renderPreview() {
            const totalQuestions = questions.length;
            const questionNumber = currentQuestionIndex + 1;
            const question = questions[currentQuestionIndex];

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'].filter(key => question.options[key] && question.options[key].trim() !== '');
            optionKeys.forEach(key => {
                const selected = studentAnswers[question.id] === key ? 'selected' : '';
                optionsHtml += `
                    <button class="academic-option-button ${selected}" onclick="selectPreviewAnswer(${question.id}, '${key}')">
                        <span class="academic-option-letter">${key}</span>
                        <span class="academic-option-text">${question.options[key]}</span>
                    </button>
                `;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 0;">
                    <div class="preview-banner">
                        <span>⚠️ Preview Mode - Results will NOT be saved</span>
                        <button class="preview-exit-btn" onclick="exitPreview()">Exit Preview</button>
                    </div>
                    
                    <div style="padding: 24px 20px;">
                        <div style="text-align: center; margin-bottom: 24px;">
                            <h1 style="color: #f9fafb; font-size: 20px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                            <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">${exam.title}</p>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <span style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Question ${questionNumber} of ${totalQuestions}</span>
                            <span class="academic-timer" style="color: #f9fafb; font-size: 14px; font-weight: 600;">${exam.time_limit} min</span>
                        </div>

                        <div class="academic-progress-bar" style="margin-bottom: 24px;">
                            <div class="academic-progress-fill" style="width: ${(questionNumber / totalQuestions) * 100}%;"></div>
                        </div>

                        <h2 class="academic-question-text">${question.question_text}</h2>

                        <div class="academic-options-container">
                            ${optionsHtml}
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button class="academic-secondary-btn" style="flex: 1;" onclick="previewPrevious()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>▸ Previous</button>
                            <button class="academic-primary-btn" style="flex: 1;" onclick="previewNext()">
                                ${currentQuestionIndex === totalQuestions - 1 ? 'Finish Preview' : 'Next ▸'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectPreviewAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderPreview();
        }

        function previewPrevious() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderPreview();
            }
        }

        function previewNext() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderPreview();
            } else {
                renderPreviewResult();
            }
        }

        function renderPreviewResult() {
            const total = questions.length;
            const answered = Object.keys(studentAnswers).length;
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 0;">
                    <div class="preview-banner">
                        <span>⚠️ Preview Mode - Results will NOT be saved</span>
                        <button class="preview-exit-btn" onclick="exitPreview()">Exit Preview</button>
                    </div>

        // ---------- Share Result ----------
        async function shareResult(resultId) {
            try {
                const data = await fetchAPI(`/api/teacher/result_details/${resultId}`);
                if (data.status !== 'success') { alert('Failed to load result details.'); return; }
                const r = data.result;
                const percentage = Math.round((r.score / r.total_questions) * 100);
                let message = `📊 *Exam Result*\n\n`;
                message += `👤 Student: ${r.student_name}\n`;
                message += `📝 Exam: ${r.exam_title}\n`;
                message += `📅 Date: ${r.completed_at || 'N/A'}\n`;
                message += `✅ Score: ${r.score}/${r.total_questions} (${percentage}%)\n\n`;
                const wrongQuestions = r.wrong_answers || [];
                if (wrongQuestions.length > 0) {
                    message += `❌ *Wrong Answers:*\n`;
                    wrongQuestions.forEach((q, i) => {
                        message += `${i+1}. ${q.question_text}\n`;
                        message += `   Your answer: ${q.selected_answer || 'No answer'}\n`;
                        message += `   Correct answer: ${q.correct_answer}\n\n`;
                    });
                } else { message += `🎉 *All answers are correct!*\n`; }
                message += `\n#YEnglishExams`;
                const shareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(message)}`;
                window.open(shareUrl, '_blank');
            } catch (error) { alert('Error loading result details.'); }
        }

        async function createExamWithJson() {
            const title = document.getElementById('examTitle').value.trim();
            const category = document.getElementById('examCategory').value.trim();
            const timeLimit = document.getElementById('examTimeLimit').value.trim();
            const questionCount = document.getElementById('examQuestionCount').value.trim();
            const questionsJson = document.getElementById('examQuestionsJson').value.trim();
            if (!title || !timeLimit || !questionCount || !questionsJson) {
                document.getElementById('createExamStatus').textContent = '⚠️ Please fill in all fields.';
                return;
            }
            let questions;
            try { questions = JSON.parse(questionsJson); }
            catch (error) { document.getElementById('createExamStatus').textContent = '⚠️ Invalid JSON format.'; return; }
            if (!Array.isArray(questions) || questions.length === 0) {
                document.getElementById('createExamStatus').textContent = '⚠️ Questions must be a non-empty array.';
                return;
            }
            if (questions.length !== parseInt(questionCount)) {
                document.getElementById('createExamStatus').textContent = '⚠️ Number of questions does not match.';
                return;
            }
            document.getElementById('createExamStatus').textContent = 'Creating exam...';
            try {
                const response = await fetch('/api/teacher/exams_with_questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ title, category: category || 'Uncategorized', time_limit: parseInt(timeLimit), questions })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    document.getElementById('createExamStatus').textContent = '✅ Exam created successfully! (ID: ' + data.exam_id + ')';
                    setTimeout(() => showCreateExam(), 2000);
                } else { document.getElementById('createExamStatus').textContent = '❌ ' + (data.message || 'Failed to create exam.'); }
            } catch (error) { document.getElementById('createExamStatus').textContent = '❌ Error creating exam.'; }
        }

        async function showSendExam() {
            document.querySelector('.exam-card').innerHTML = `<div style="text-align: center; padding: 40px;"><p style="color: #9ca3af;">Loading...</p></div>`;
            try {
                const [examsData, assignmentsData, groupsData] = await Promise.all([
                    fetchAPI('/api/teacher/exams'), fetchAPI('/api/teacher/assignments'), fetchAPI('/api/teacher/groups')
                ]);
                if (examsData.status !== 'success' || assignmentsData.status !== 'success' || groupsData.status !== 'success') {
                    showError('Failed to load data.'); return;
                }
                allGroups = groupsData.groups || [];
                window.allExams = examsData.exams || [];
                window.allAssignments = assignmentsData.assignments || [];
                window.openCategories = {};
                renderSendExamList();
            } catch (error) { showError('Error loading data.'); }

        // ---------- Render Send Exam List (با فیلتر و Toggle) ----------
        function renderSendExamList() {
            const searchTerm = (document.getElementById('examSearchInput')?.value || '').toLowerCase();
            const categoryFilter = document.getElementById('examCategoryFilter')?.value || 'all';

            const assignedMap = {};
            window.allAssignments.forEach(a => { assignedMap[a.exam_id] = a; });

            let filteredExams = window.allExams.filter(e => {
                const matchesSearch = e.title.toLowerCase().includes(searchTerm);
                const matchesCategory = categoryFilter === 'all' || (e.category || 'Uncategorized') === categoryFilter;
                return matchesSearch && matchesCategory;
            });

            const grouped = {};
            filteredExams.forEach(e => {
                const cat = e.category || 'Uncategorized';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(e);
            });

            const allCategories = [...new Set(window.allExams.map(e => e.category || 'Uncategorized'))].sort();
            let categoryOptions = '<option value="all">All Categories</option>';
            allCategories.forEach(cat => {
                const selected = cat === categoryFilter ? 'selected' : '';
                categoryOptions += `<option value="${cat}" ${selected}>${cat}</option>`;
            });

            if (!window.openCategories) {
                window.openCategories = {};
            }

            let html = `
                <div style="padding: 20px;">
                    <button class="academic-back-button" onclick="renderDashboard(USER_DATA)">▸ Back</button>
                    <h2 class="academic-page-title">Send Exam</h2>
                    
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
                        <input 
                            type="text" 
                            id="examSearchInput" 
                            placeholder="🔍 Search exams..." 
                            class="academic-input"
                            oninput="renderSendExamList()"
                            value="${searchTerm}"
                        >
                        <select 
                            id="examCategoryFilter" 
                            class="academic-input"
                            onchange="renderSendExamList()"
                        >
                            ${categoryOptions}
                        </select>
                    </div>
                    
                    <p style="color: #9ca3af; font-size: 13px; margin-bottom: 12px;">
                        Showing ${filteredExams.length} of ${window.allExams.length} exams
                    </p>
            `;

            if (filteredExams.length === 0) {
                html += `<p style="color: #fbbf24; text-align: center; padding: 20px;">No exams match your search.</p>`;
            } else {
                Object.keys(grouped).sort().forEach(cat => {
                    const catId = cat.replace(/[^a-zA-Z0-9]/g, '_');
                    const isOpen = window.openCategories[catId] === true;
                    const examCount = grouped[cat].length;
                    
                    html += `
                        <div style="margin-bottom: 12px;">
                            <div 
                                onclick="toggleCategory('${catId}')"
                                style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; cursor: pointer; user-select: none;"
                            >
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span id="arrow_${catId}" style="color: #60a5fa; font-size: 16px; transition: transform 0.2s; display: inline-block; ${isOpen ? 'transform: rotate(90deg);' : ''}">▸</span>
                                    <strong style="color: #60a5fa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">${cat}</strong>
                                    <span style="color: #6b7280; font-size: 12px;">(${examCount})</span>
                                </div>
                            </div>
                            <div id="cat_${catId}" style="display: ${isOpen ? 'block' : 'none'}; margin-top: 8px; padding-left: 8px;">
                    `;
                    
                    grouped[cat].forEach(e => {
                        const assigned = assignedMap[e.id];
                        const isAssigned = !!assigned;
                        html += `
                            <div class="academic-card" style="margin-bottom: 6px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div style="flex: 1; min-width: 0;">
                                        <strong style="color: #f9fafb; display: block; font-size: 14px;">${e.title}</strong>
                                        <span style="color: #9ca3af; font-size: 12px; display: block;">Questions: ${e.question_count || 0} | Time: ${e.time_limit} min</span>
                                        ${isAssigned ? `<span style="color: #60a5fa; font-size: 11px;">📌 ${assigned.group_name} (ID: ${assigned.group_id})</span>` : `<span style="color: #fbbf24; font-size: 11px;">⚠️ Not assigned</span>`}
                                    </div>
                                    <div style="flex-shrink: 0; display: flex; gap: 4px;">
                                        ${isAssigned ? 
                                            `<button class="academic-icon-btn primary" onclick="sendExamByExamId(${e.id})" title="Send">📤</button>
                                             <button class="academic-icon-btn danger" onclick="unassignExam(${e.id})" title="Unassign">🔓</button>` :
                                            `<button class="academic-primary-btn small" onclick="showAssignForm(${e.id})">Assign</button>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            document.querySelector('.exam-card').innerHTML = html;
        }

        // ---------- Toggle Category ----------
        function toggleCategory(catId) {
            if (!window.openCategories) window.openCategories = {};
            window.openCategories[catId] = !window.openCategories[catId];
            
            const element = document.getElementById('cat_' + catId);
            const arrow = document.getElementById('arrow_' + catId);
            
            if (window.openCategories[catId]) {
                element.style.display = 'block';
                arrow.style.transform = 'rotate(90deg)';
            } else {
                element.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        async function assignAndSendExamWithGroups(examId) {
            const checkboxes = document.querySelectorAll('.assign-group-checkbox:checked');
            const groupIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (groupIds.length === 0) {
                document.getElementById('assignStatus').textContent = '⚠️ Please select at least one group.';
                return;
            }
            document.getElementById('assignStatus').textContent = 'Assigning...';
            try {
                const assignResponse = await fetch('/api/teacher/assign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const assignData = await assignResponse.json();
                if (assignData.status !== 'success') {
                    document.getElementById('assignStatus').textContent = '❌ ' + (assignData.message || 'Failed.');
                    return;
                }
                document.getElementById('assignStatus').textContent = '✅ Assigned! Sending...';
                const sendResponse = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: groupIds })
                });
                const sendData = await sendResponse.json();
                if (sendData.status === 'success') {
                    document.getElementById('assignStatus').textContent = '✅ ' + (sendData.message || 'Sent!');
                    setTimeout(() => showSendExam(), 2000);
                } else {
                    document.getElementById('assignStatus').textContent = '❌ ' + (sendData.message || 'Failed.');
                }
            } catch (error) { document.getElementById('assignStatus').textContent = '❌ Error.'; }
        }

        async function unassignExam(examId) {
            if (!confirm(`Unassign exam ID ${examId}? Results are preserved.`)) return;
            try {
                const response = await fetch('/api/teacher/unassign_exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId })
                });
                const data = await response.json();
                if (data.status === 'success') { alert('✅ Unassigned.'); showSendExam(); }
                else { alert('❌ ' + (data.message || 'Failed.')); }
            } catch (error) { alert('❌ Error.'); }
        }

        async function sendExamByExamId(examId) {
            let assignedGroupIds = [];
            try {
                const assignData = await fetchAPI('/api/teacher/assignments');
                assignedGroupIds = assignData.assignments.filter(a => a.exam_id === examId).map(a => a.group_id);
            } catch (e) { alert('❌ Could not find groups.'); return; }
            if (assignedGroupIds.length === 0) { alert('❌ Not assigned.'); return; }
            const statusDiv = document.createElement('div');
            statusDiv.style.cssText = 'margin-top: 12px; color: #9ca3af; text-align: center;';
            document.querySelector('.exam-card > div').appendChild(statusDiv);
            statusDiv.textContent = 'Sending...';
            try {
                const response = await fetch('/api/teacher/send_exam_by_exam_id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify({ exam_id: examId, group_ids: assignedGroupIds })
                });
                const data = await response.json();
                statusDiv.textContent = data.status === 'success' ? '✅ ' + (data.message || 'Sent!') : '❌ ' + (data.message || 'Failed.');
            } catch (error) { statusDiv.textContent = '❌ Error.'; }
        }

        function showError(message) {
            document.querySelector('.exam-card').innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <h1 style="color: #fca5a5; font-size: 18px;">Error</h1>
                    <p style="color: #9ca3af; font-size: 14px;">${message}</p>
                    <button class="academic-primary-btn" style="margin-top: 20px;" onclick="startApp()">Try Again</button>
                </div>
            `;
        }

        // ============================================================
        // STUDENT EXAM (Academic Design)
        // ============================================================

        async function loadStudentExam(examId) {
            try {
                statusElement.textContent = 'Loading exam...';
                const response = await fetch(`/api/exam/${examId}/questions`, {
                    method: 'GET',
                    headers: { 'X-Telegram-Init-Data': telegram?.initData || '' }
                });
                if (!response.ok) {
                    let message = `HTTP Error ${response.status}`;
                    try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                    showError('Server Error: ' + message); return;
                }
                const data = await response.json();
                if (data.status !== 'success') { showError('API Error: ' + (data.message || 'Unknown')); return; }
                if (!data.exam) { showError('Exam data missing.'); return; }
                exam = data.exam;
                questions = data.questions || [];
                if (questions.length === 0) { showError('No questions.'); return; }
                startedAt = new Date().toISOString();
                currentQuestionIndex = 0;
                remainingSeconds = Number(exam.time_limit) * 60;
                startTimer();
                renderStudentQuestion();
            } catch (error) { showError('Unexpected Error: ' + error.message); }
        }

        function renderStudentQuestion() {
            const totalQuestions = questions.length;
            const questionNumber = currentQuestionIndex + 1;
            const question = questions[currentQuestionIndex];

            let optionsHtml = '';
            const optionKeys = ['A', 'B', 'C', 'D'].filter(key => question.options[key] && question.options[key].trim() !== '');
            optionKeys.forEach(key => {
                const selected = studentAnswers[question.id] === key ? 'selected' : '';
                optionsHtml += `
                    <button class="academic-option-button ${selected}" onclick="selectStudentAnswer(${question.id}, '${key}')">
                        <span class="academic-option-letter">${key}</span>
                        <span class="academic-option-text">${question.options[key]}</span>
                    </button>
                `;
            });

            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 24px 20px;">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <h1 style="color: #f9fafb; font-size: 20px; font-weight: 600; margin: 0;">YEnglish Exams</h1>
                        <p style="color: #9ca3af; font-size: 14px; margin: 4px 0 0 0;">${exam.title}</p>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <span style="color: #60a5fa; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Question ${questionNumber} of ${totalQuestions}</span>
                        <span class="academic-timer" id="academicTimer" style="color: #f9fafb; font-size: 14px; font-weight: 600;">${formatTime(remainingSeconds)}</span>
                    </div>

                    <div class="academic-progress-bar" style="margin-bottom: 24px;">
                        <div class="academic-progress-fill" style="width: ${(questionNumber / totalQuestions) * 100}%;"></div>
                    </div>

                    <h2 class="academic-question-text">${question.question_text}</h2>

                    <div class="academic-options-container">
                        ${optionsHtml}
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button class="academic-secondary-btn" style="flex: 1;" onclick="studentPrevious()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>▸ Previous</button>
                        <button class="academic-primary-btn" style="flex: 1;" onclick="studentNext()">
                            ${currentQuestionIndex === totalQuestions - 1 ? 'Submit Exam' : 'Next ▸'}
                        </button>
                    </div>

                    <div id="examStatus" style="margin-top: 16px; color: #9ca3af; text-align: center; font-size: 13px;"></div>
                </div>
            `;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function selectStudentAnswer(questionId, optionKey) {
            studentAnswers[questionId] = optionKey;
            renderStudentQuestion();
        }

        function studentPrevious() {
            if (currentQuestionIndex > 0 && !isSubmitting) {
                currentQuestionIndex--;
                renderStudentQuestion();
            }
        }

        async function studentNext() {
            if (isSubmitting) return;
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderStudentQuestion();
                return;
            }
            await submitStudentExam();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                remainingSeconds--;
                const timerEl = document.getElementById('academicTimer');
                if (timerEl) timerEl.textContent = formatTime(remainingSeconds);
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isSubmitting = true;
                }
            }, 1000);
        }

        async function submitStudentExam() {
            if (isSubmitting) return;
            const confirmed = confirm('Are you sure you want to submit?');
            if (!confirmed) return;
            isSubmitting = true;
            const statusEl = document.getElementById('examStatus');
            if (statusEl) statusEl.textContent = 'Submitting...';
            try {
                const payload = { exam_id: Number(examId), answers: studentAnswers, started_at: startedAt };
                const response = await fetch('/api/exam/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': telegram?.initData || '' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    let message = `Failed (HTTP ${response.status})`;
                    try { const errorData = await response.json(); if (errorData.message) message = errorData.message; } catch (e) {}
                    throw new Error(message);
                }
                const data = await response.json();
                if (data.status !== 'success') throw new Error(data.message || 'Failed.');
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                renderStudentResult(data.result);
            } catch (error) {
                isSubmitting = false;
                if (statusEl) statusEl.textContent = error.message || 'Could not submit.';
            }
        }

        function renderStudentResult(result) {
            const score = result.score;
            const total = result.total_questions;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            document.querySelector('.exam-card').innerHTML = `
                <div style="padding: 40px 24px; text-align: center;">
                    <div style="font-size: 56px; margin-bottom: 16px;">🎉</div>
                    <h1 style="color: #60a5fa; font-size: 24px; font-weight: 700; margin: 0 0 24px 0;">Exam Completed</h1>
                    <div class="academic-result-score" style="font-size: 56px; font-weight: 800; color: #f9fafb; margin: 16px 0;">${score} / ${total}</div>
                    <div class="academic-result-percentage" style="font-size: 28px; font-weight: 700; color: #34d399; margin-top: 12px;">${percentage}%</div>
                    <p style="color: #9ca3af; font-size: 14px; margin-top: 24px;">Your result has been saved and sent to the teacher.</p>
                </div>
            `;
        }

        // ============================================================
        // MAIN APPLICATION
        // ============================================================

        async function startApp() {
            try {
                const userData = await fetchAPI('/api/me');
                if (userData.status !== 'success') { showError(userData.message || 'Auth failed.'); return; }
                USER_DATA = userData;
                if (userData.is_teacher) {
                    renderDashboard(userData);
                } else {
                    const startParam = telegram?.initDataUnsafe?.start_param || null;
                    examId = null;
                    if (startParam && startParam.startsWith('exam_')) examId = startParam.substring(5);
                    if (!examId) { showError('Exam ID not received.'); return; }
                    await loadStudentExam(examId);
                }
            } catch (error) { showError('Unable to start.'); }
        }

        startApp();
    </script>

</body>

</html>
